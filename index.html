<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>Gridiron — NFL Flash Cards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
/* ============================================================
   GRIDIRON — retro bubblegum NFL flash cards
   One file. No build step. No API keys. Saves to localStorage.
   ============================================================ */

:root{
  --stock:#f2e8d2;          /* card stock cream */
  --stock-dim:#e4d7bb;
  --ink:#1b1a17;
  --ink-soft:#5a5344;
  --felt:#1c1a17;           /* app background */
  --felt-2:#262320;
  --rule:#c9b990;
  --accent:#d8a32b;
  --radius:14px;
  --card-w:224px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2f2b26 0%, transparent 60%),
    var(--felt);
  color:var(--stock);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(28,26,23,.97),rgba(28,26,23,.86));
  backdrop-filter:blur(10px);
  border-bottom:1px solid #3a352e;
}
.brand{
  font-family:Impact,"Haettenschweiler","Arial Narrow Bold",Oswald,sans-serif;
  font-size:22px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--stock);line-height:1;white-space:nowrap;
}
.brand em{
  display:block;font:500 9px/1.2 ui-sans-serif,sans-serif;font-style:normal;
  letter-spacing:.24em;color:var(--accent);margin-top:3px;
}
.bar .spacer{flex:1}
.search{
  flex:1;min-width:0;max-width:320px;
  background:#141312;border:1px solid #413b33;border-radius:999px;
  padding:8px 14px;color:var(--stock);outline:none;font-size:14px;
}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:#7d7364}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid #413b33;
  background:#141312;display:grid;place-items:center;font-size:16px;flex:none;
}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.primary{background:var(--accent);color:#20180a;border-color:var(--accent);font-weight:700}

/* ---------- deck rail ---------- */
.decks{
  display:flex;gap:8px;padding:10px 14px;overflow-x:auto;
  scrollbar-width:none;border-bottom:1px solid #302b25;
  position:sticky;top:61px;z-index:35;background:rgba(28,26,23,.94);backdrop-filter:blur(8px);
}
.decks::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;border:1px solid #4a4238;
  background:#211e1a;color:#c8bda6;font-size:13px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.chip .n{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--stock);color:#1b1a17;border-color:var(--stock);font-weight:600}
.chip[aria-selected="true"] .n{opacity:.55}
.chip.add{border-style:dashed;color:#8e8471}

/* ---------- grid ---------- */
.grid{
  display:grid;gap:18px;padding:18px 14px calc(90px + var(--safe-b));
  grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));
  max-width:1400px;margin:0 auto;
}
.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:#8a8072;
}
.empty h2{font-family:Impact,sans-serif;letter-spacing:.05em;color:#c9bda4;margin:0 0 8px;text-transform:uppercase;font-size:20px}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.6}
.btn{
  display:inline-block;padding:10px 18px;border-radius:10px;
  background:var(--accent);color:#20180a;font-weight:700;font-size:14px;
}
.btn.ghost{background:none;border:1px solid #4a4238;color:#c8bda6;font-weight:500}

/* ---------- the card ---------- */
.card{
  perspective:1400px;aspect-ratio:2.5/3.5;position:relative;
  animation:deal .32s cubic-bezier(.2,.9,.3,1.2) backwards;
}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}

.flipper{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.9,.3,1);
  cursor:pointer;
}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}}
.card.flipped .flipper{transform:rotateY(180deg)}
/* only the face you're looking at may be clicked */
.card:not(.flipped) .back{pointer-events:none}
.card.flipped .front{pointer-events:none}

.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radius);overflow:hidden;
  background:var(--stock);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 10px 22px -8px rgba(0,0,0,.75), 0 2px 5px rgba(0,0,0,.4);
}
.face::after{ /* card-stock grain */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(120,100,60,.14) .5px,transparent .5px);
  background-size:3px 3px;
}
.back{transform:rotateY(180deg)}

/* ----- FRONT ----- */
.front{padding:9px 9px 0;display:flex;flex-direction:column;background:var(--stock)}
.photo{
  position:relative;flex:1;border-radius:6px;overflow:hidden;
  background:linear-gradient(170deg,var(--c1) 0%,var(--c1) 55%,var(--c2) 100%);
  display:grid;place-items:center;
}
.photo img{
  width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;
  filter:saturate(.92) contrast(1.04);
}
.photo img[hidden]{display:none}
/* fallback silhouette when no/blocked photo.
   [hidden] needs saying out loud — the class sets display:grid, which
   outranks the UA stylesheet's [hidden]{display:none} and would leave the
   fallback painted on top of a perfectly good photo. */
.silo[hidden]{display:none}
.silo{
  position:absolute;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(70% 55% at 50% 78%, rgba(255,255,255,.16), transparent 70%),
    linear-gradient(170deg,var(--c1),var(--c2));
}
.silo b{
  font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:46px;letter-spacing:.02em;
  color:rgba(255,255,255,.9);text-shadow:0 2px 0 rgba(0,0,0,.28);line-height:1;
}
.silo i{
  position:absolute;bottom:8px;font-style:normal;font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.62);text-transform:uppercase;
}
/* corner pennant with position */
.pennant{
  position:absolute;top:0;left:0;
  background:var(--c1);color:#fff;font:700 10px/1 ui-sans-serif,sans-serif;
  letter-spacing:.12em;padding:6px 12px 6px 8px;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  box-shadow:inset 0 -2px 0 var(--c2);
}
.jersey{
  position:absolute;top:7px;right:8px;
  font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:26px;line-height:1;
  color:rgba(255,255,255,.94);text-shadow:0 2px 3px rgba(0,0,0,.45);
}
.nameplate{
  padding:8px 2px 9px;text-align:center;position:relative;
}
.nameplate .nm{
  font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
  font-size:clamp(13px,4.4cqw,17px);letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink);line-height:1.02;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nameplate .tm{
  display:block;margin-top:3px;font:600 8.5px/1 ui-sans-serif,sans-serif;
  letter-spacing:.2em;text-transform:uppercase;color:var(--c1);
}
.card{container-type:inline-size}
.tape{ /* team color stripe under the photo */
  height:4px;margin-top:6px;border-radius:2px;
  background:linear-gradient(90deg,var(--c1) 0 60%,var(--c2) 60% 100%);
}

/* ----- BACK ----- */
.back{
  background:#efe3c6;
  display:flex;flex-direction:column;padding:11px 11px 9px;
  font-family:Georgia,"Times New Roman",serif;color:#241f16;
}
.back::before{
  content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
  background-image:radial-gradient(rgba(150,120,60,.18) .6px,transparent .6px);
  background-size:4px 4px;
}
.bhead{display:flex;align-items:flex-start;gap:8px;position:relative}
.cardno{
  flex:none;width:26px;height:26px;border-radius:50%;
  background:var(--c1);color:#fff;display:grid;place-items:center;
  font:700 11px/1 ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.bname{flex:1;min-width:0}
.bname b{
  display:block;font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;
  font-size:14px;letter-spacing:.02em;text-transform:uppercase;line-height:1.06;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bname span{font:italic 10px/1.3 Georgia,serif;color:#6b5f45;display:block;margin-top:2px}
.bio{
  margin:8px 0 0;font-size:9.5px;line-height:1.45;color:#4f4634;
  border-top:1px solid rgba(120,95,45,.3);border-bottom:1px solid rgba(120,95,45,.3);
  padding:5px 0;position:relative;
}
.statwrap{flex:1;min-height:0;overflow:auto;margin-top:7px;position:relative;scrollbar-width:thin}
.statwrap::-webkit-scrollbar{width:4px}
.statwrap::-webkit-scrollbar-thumb{background:rgba(120,95,45,.35);border-radius:4px}
.slabel{
  font:700 8px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:#8a7a53;display:flex;align-items:center;gap:6px;margin-bottom:4px;
}
.slabel::after{content:"";flex:1;height:1px;background:rgba(120,95,45,.3)}
table.stats{width:100%;border-collapse:collapse;font-family:ui-sans-serif,sans-serif}
table.stats td{
  padding:2.5px 0;font-size:10px;vertical-align:baseline;
  border-bottom:1px dotted rgba(120,95,45,.35);
}
table.stats td:first-child{color:#6b5f45;letter-spacing:.02em}
table.stats td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:#241f16}
.honors{
  margin-top:7px;font-size:9px;line-height:1.5;color:#5c5139;position:relative;
}
.honors b{font:700 8px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;color:#8a7a53;text-transform:uppercase}

/* the old "cartoon fact" box, repurposed for live news */
.newsbox{
  flex:none;margin-top:7px;border:1.5px solid #7d6a3c;border-radius:5px;
  background:#f8f0da;padding:6px 8px 7px;position:relative;
}
.newsbox p{max-height:54px;overflow:auto;scrollbar-width:thin}
.newsbox .nlab{
  font:700 7.5px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:#9a7b2c;display:flex;align-items:center;gap:5px;margin-bottom:3px;
}
.newsbox .nlab .dot{width:5px;height:5px;border-radius:50%;background:#b98b1e;flex:none}
.newsbox .nlab .dot.live{background:#2e8b45;box-shadow:0 0 0 2px rgba(46,139,69,.2)}
.newsbox p{margin:0;font-size:9.5px;line-height:1.42;color:#3b3324}
.newsbox .src{
  display:block;margin-top:4px;font:600 8px/1 ui-sans-serif,sans-serif;
  color:#8a7a53;letter-spacing:.04em;
}
.newsbox a{color:#8a5b12}

.backtools{
  flex:none;display:flex;gap:5px;margin-top:7px;position:relative;
}
.backtools button{
  flex:1;padding:5px 4px;border-radius:5px;border:1px solid rgba(120,95,45,.45);
  background:rgba(255,255,255,.4);
  font:600 8.5px/1.2 ui-sans-serif,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:#5c5139;
}
.backtools button:hover{background:#fff;border-color:#7d6a3c}
.backtools button.busy{opacity:.5;pointer-events:none}

/* ---------- the stack (shoebox view) ----------
   One card at a time, the rest peeking out behind it. Drag it left to pass,
   right to file it into a deck — the way you'd actually sort a shoebox. */
.stagewrap{
  display:none;flex-direction:column;align-items:center;
  gap:15px;padding:20px 14px calc(26px + var(--safe-b));
  /* No selecting on the stack. The first swipe would otherwise select the name
     on the card, and the next press landing on that selection makes the browser
     start a native text drag — which fires pointercancel and silently killed
     every swipe after the first. */
  user-select:none;-webkit-user-select:none;
}
.stage img{-webkit-user-drag:none;user-drag:none}
body.stackmode .stagewrap{display:flex}
body.stackmode .grid{display:none}
body.stackmode .fab{display:none}

.filing{
  display:flex;align-items:center;gap:9px;
  font:600 9px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:#9a8f7c;
}
.filing select{
  background:#141312;border:1px solid #413b33;border-radius:999px;
  color:var(--stock);padding:7px 12px;outline:none;
  font-size:13px;letter-spacing:0;text-transform:none;font-weight:500;
}
.filing select:focus{border-color:var(--accent)}

/* padding-bottom is clearance for the two cards peeking out underneath —
   without it they overlap the swipe buttons. */
.stagebox{position:relative;width:min(300px,76vw);padding-bottom:34px}
/* pan-y so a vertical scroll still scrolls the page, but horizontal drags
   are ours — otherwise mobile steals the gesture halfway through a swipe. */
.stage{position:relative;width:100%;aspect-ratio:2.5/3.5;touch-action:pan-y}
.stage .card{position:absolute;inset:0;animation:none}
.stage .card[data-depth="0"]{z-index:3;cursor:grab;animation:rise .26s cubic-bezier(.2,.9,.3,1.1)}
.stage .card[data-depth="1"]{z-index:2;transform:translateY(16px) scale(.96) rotate(-2.6deg);filter:brightness(.78)}
.stage .card[data-depth="2"]{z-index:1;transform:translateY(30px) scale(.92) rotate(2.4deg);filter:brightness(.58)}
.stage .card[data-depth="1"],.stage .card[data-depth="2"]{pointer-events:none}
@keyframes rise{from{transform:translateY(16px) scale(.96) rotate(-2.6deg)}}
/* spring back when you let go short of the line */
.stage .card.settling{transition:transform .34s cubic-bezier(.2,.9,.3,1.2)}
.stage .card.gone{transition:transform .3s ease-in,opacity .3s ease-in;opacity:0}
@media (prefers-reduced-motion:reduce){
  .stage .card[data-depth="0"]{animation:none}
  .stage .card.settling,.stage .card.gone{transition:none}
}

.stamp{
  position:absolute;top:18px;z-index:6;pointer-events:none;opacity:0;
  font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:25px;letter-spacing:.09em;
  text-transform:uppercase;padding:4px 12px 5px;border:3px solid;border-radius:7px;
  background:rgba(20,18,16,.35);
}
.stamp.file{right:12px;color:#4fb469;border-color:#4fb469;transform:rotate(12deg)}
.stamp.pass{left:12px;color:#d2634c;border-color:#d2634c;transform:rotate(-12deg)}

.swipebar{display:flex;align-items:center;gap:15px}
.swipebar button{
  width:52px;height:52px;border-radius:50%;border:1px solid #4a4238;
  background:#211e1a;display:grid;place-items:center;font-size:19px;color:#c8bda6;
  box-shadow:0 4px 12px -4px rgba(0,0,0,.6);
}
.swipebar button.undo{width:40px;height:40px;font-size:15px;color:#8a8072}
.swipebar button.pass:hover{border-color:#d2634c;color:#e0755f}
.swipebar button.file:hover{border-color:#4fb469;color:#5fc47c}
.swipebar button.undo:hover{border-color:#8a8072;color:#c8bda6}
.swipebar button:disabled{opacity:.3;pointer-events:none}
.counter{
  font:600 10px/1 ui-sans-serif,sans-serif;letter-spacing:.18em;
  text-transform:uppercase;color:#7d7364;font-variant-numeric:tabular-nums;
}
.stackdone{text-align:center;color:#8a8072;padding:26px 10px 6px;max-width:300px}
.stackdone h2{
  font-family:Impact,sans-serif;font-weight:400;letter-spacing:.05em;
  text-transform:uppercase;font-size:19px;color:#c9bda4;margin:0 0 7px;
}
.stackdone p{margin:0 0 16px;font-size:13px;line-height:1.6}

/* ---------- modals ---------- */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(10,9,8,.72);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:min(460px,100%);max-height:88vh;overflow:auto;
  background:#211e1a;border:1px solid #443c32;border-radius:16px;
  padding:20px;box-shadow:0 24px 60px -12px rgba(0,0,0,.8);
}
.sheet h3{
  margin:0 0 16px;font-family:Impact,sans-serif;font-weight:400;
  letter-spacing:.05em;text-transform:uppercase;font-size:17px;color:var(--stock);
}
.field{margin-bottom:12px}
.field label{
  display:block;font:600 9px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:#9a8f7c;margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid #443c32;
  background:#161412;color:var(--stock);outline:none;font-size:14px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px;line-height:1.5}
.row{display:flex;gap:10px}
.row .field{flex:1}
.hint{font-size:11px;color:#8a8072;line-height:1.5;margin:-6px 0 12px}
.actions{display:flex;gap:9px;margin-top:18px}
.actions .btn{flex:1;text-align:center;border:none;cursor:pointer}
.danger{color:#e0755f}

.decklist{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.deckrow{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
  background:#191715;border:1px solid #3a332b;
}
.deckrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none}
.deckrow span{flex:1;font-size:14px}
.deckrow small{font-size:11px;color:#847a6a;font-variant-numeric:tabular-nums}

/* Import progress. Named .pbar, not .bar — that one is the sticky header, and
   `height:6px;overflow:hidden` landing on it clipped the whole top of the app. */
.pbar{
  height:6px;border-radius:999px;background:#161412;overflow:hidden;
  border:1px solid #3a332b;margin-top:14px;
}
.pbar i{
  display:block;height:100%;width:0;border-radius:999px;background:var(--accent);
  transition:width .3s ease;
}

.toast{
  position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);
  background:var(--stock);color:#1b1a17;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:600;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.5);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}

.fab{
  position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#20180a;
  font-size:26px;display:grid;place-items:center;font-weight:700;
  box-shadow:0 8px 22px -4px rgba(0,0,0,.7);
}
@media(min-width:640px){.fab{display:none}}
@media(max-width:420px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;padding:14px 11px 100px}
  .brand{font-size:19px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Gridiron<em>flash cards</em></div>
  <span class="spacer"></span>
  <input id="search" class="search" type="search" placeholder="Search cards…" autocomplete="off">
  <button class="iconbtn" id="viewBtn" title="Switch view">▤</button>
  <button class="iconbtn primary" id="addCardBtn" title="New card">+</button>
  <button class="iconbtn" id="menuBtn" title="Menu">⋯</button>
</header>

<nav class="decks" id="deckBar"></nav>
<main class="grid" id="grid"></main>

<!-- The shoebox: one card up front, the rest of the stack behind it. -->
<section class="stagewrap" id="stagewrap">
  <div class="filing">
    <span>Filing into</span>
    <select id="fileTo" aria-label="Deck that swiping right files into"></select>
  </div>
  <div class="stagebox">
    <div class="stage" id="stage"></div>
    <div class="stamp pass" id="stampPass">Pass</div>
    <div class="stamp file" id="stampFile">File</div>
  </div>
  <div class="stackdone" id="stackDone" hidden></div>
  <div class="swipebar">
    <button class="pass" id="swPass" title="Pass — left arrow">✕</button>
    <button class="undo" id="swUndo" title="Put the last one back — backspace">⟲</button>
    <button class="file" id="swFile" title="File it — right arrow">★</button>
  </div>

/* ============================================================
   3. STATE + STORAGE
   ============================================================ */
const KEY = 'gridiron.v1';
const uid = p => p + Math.random().toString(36).slice(2,9);

/* Where the deck comes from: the baked file if you've run the bake, otherwise
   the small deck built into this file. */
const BAKED = Array.isArray(window.GRIDIRON_CARDS) && window.GRIDIRON_CARDS.length > 0;
const STAMP = BAKED ? 'baked:' + window.GRIDIRON_CARDS.length : 'builtin';

function builtInCards(){
  const cards = {};
  SEED.forEach((r,i) => {
    const id = 'seed_' + i;
    cards[id] = {
      id, name:r.n, team:r.t, pos:r.p, jersey:r.j, espnId:r.e,
      bio:r.b, stats:r.s.map(([k,v])=>({k,v})), honors:r.h, note:r.w,
      photo:null, no:i+1, live:null
    };
  });
  return cards;
}

function bakedCards(){
  const cards = {};
  window.GRIDIRON_CARDS.forEach(c => {
    if(!c || !c.id || !c.name) return;
    cards[c.id] = {
      live:null, honors:'', note:'', photo:null, stats:[], espnId:null,
      ...c, jersey: c.jersey ?? ''
    };
  });
  return cards;
}

const defaultCards = () => BAKED ? bakedCards() : builtInCards();

function load(){
  let saved = null;
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.cards && s.decks) saved = s;
    }
  }catch(e){ console.warn('Could not read saved data:', e); }

  if(!saved) return {
    cards: defaultCards(),
    decks: [{id:'d_starter', name:'Starter Pack', cards:[]}],
    active: 'ALL',
    view: 'grid',
    fileTo: 'd_starter',
    flipped: {},
    stamp: STAMP
  };

  // An in-app league import is newer and more specific than any baked file
  // sitting on disk — never let the bake clobber it.
  const imported = String(saved.stamp || '').startsWith('espn:');
  return (BAKED && !imported && saved.stamp !== STAMP) ? adoptBaked(saved) : saved;
}

/* A fresh bake landed. Swap in the new deck, keep every card you made
   yourself, and follow your decks across by name so the stacks survive. */
function adoptBaked(saved){
  const fresh  = bakedCards();
  const byName = {};
  Object.values(fresh).forEach(c => { byName[c.name.toLowerCase()] = c.id; });

  const mine = {};
  Object.values(saved.cards || {}).forEach(c => {
    const id = String(c.id);
    if(id.startsWith('c_')) mine[id] = c;
    // a scouted player the bake doesn't know — practice squad, just signed —
    // keeps his card rather than vanishing under the new deck
    else if(id.startsWith('espn_') && !fresh[id] && !byName[String(c.name).toLowerCase()])
      mine[id] = c;
  });

  const remap = oldId => {
    if(mine[oldId]) return oldId;
    const old = saved.cards?.[oldId];
    return old ? (byName[String(old.name).toLowerCase()] || null) : null;
  };

  const decks = (saved.decks || []).map(d => ({
    ...d, cards: [...new Set((d.cards || []).map(remap).filter(Boolean))]
  }));

  return {
    cards: {...fresh, ...mine},
    decks,
    active: (saved.active === 'ALL' || decks.some(d => d.id === saved.active))
      ? saved.active : 'ALL',
    view: saved.view,
    fileTo: saved.fileTo,
    flipped: {},
    stamp: STAMP
  };
}

/* Declared after everything load() leans on, so the consts above are
   initialised by the time it runs. */
let state = load();

/* Fields that arrived after the first release. A collection saved by an older
   build — or imported from someone else's export — simply won't have them, so
   fill them in rather than letting the stack read `undefined`. */
if(state.view !== 'stack') state.view = 'grid';
if(!state.decks.some(d => d.id === state.fileTo)) state.fileTo = state.decks[0]?.id || null;

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('Storage full — try smaller photos'); }
  }, 120);
}

   ============================================================ */
const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function teamOf(ab){ return TEAMS[ab] || TEAMS.FA; }
function initials(name){
  return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w=>w[0]).join('').toUpperCase();
}
/* Photos, in order of preference:
   1. one you set yourself (upload or pasted URL)
   2. a headshot cached on this device by the league import — no network
   3. the remote URL, only until you've imported                        */
function photoURL(c){
  if(c.photo) return c.photo;
  if(c.espnId && PHOTOS.has(c.espnId)) return PHOTOS.get(c.espnId);
  if(c.photoRemote) return c.photoRemote;
  if(c.espnId) return `${ESPN.cdn}/${c.espnId}.png&w=350&h=254`;
  return null;
}
function newsSearchURL(c){
  const t = teamOf(c.team)[0];
  return 'https://news.google.com/search?q=' + encodeURIComponent(`"${c.name}" ${t} NFL`);
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

/* ============================================================
   4b. PHOTO VAULT (IndexedDB)
   Headshots are far too big for localStorage, so cached images live in
   IndexedDB as blobs. On boot we mint an object URL for each one, and
   from then on every photo on screen is served from this device.
   ============================================================ */
const VAULT = {db:'gridiron', store:'photos', version:1};
const PHOTOS = new Map();          // espnId -> blob: URL

function openVault(){
  return new Promise((res, rej) => {
    const r = indexedDB.open(VAULT.db, VAULT.version);
    r.onupgradeneeded = () => {
      if(!r.result.objectStoreNames.contains(VAULT.store)) r.result.createObjectStore(VAULT.store);
    };
    r.onsuccess = () => res(r.result);
    r.onerror   = () => rej(r.error);
  });
}

function vaultTx(mode, fn){
  return openVault().then(db => new Promise((res, rej) => {
    const tx = db.transaction(VAULT.store, mode);
    const out = fn(tx.objectStore(VAULT.store));
    tx.oncomplete = () => res(out?.result ?? out);
    tx.onerror    = () => rej(tx.error);
  }));
}

const vaultPut   = (k, blob) => vaultTx('readwrite', s => s.put(blob, k));
const vaultClear = ()        => vaultTx('readwrite', s => s.clear());

/** Pull every cached headshot into memory as object URLs. */
async function loadVault(){
  try{
    const db = await openVault();
    const [keys, vals] = await Promise.all([
      new Promise((res,rej)=>{ const q = db.transaction(VAULT.store).objectStore(VAULT.store).getAllKeys();
        q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); }),
      new Promise((res,rej)=>{ const q = db.transaction(VAULT.store).objectStore(VAULT.store).getAll();
        q.onsuccess=()=>res(q.result); q.onerror=()=>rej(q.error); })
    ]);
    PHOTOS.forEach(u => URL.revokeObjectURL(u));
    PHOTOS.clear();
    keys.forEach((k, i) => { if(vals[i]) PHOTOS.set(String(k), URL.createObjectURL(vals[i])); });
  }catch(e){ console.warn('Photo vault unavailable:', e); }
  return PHOTOS.size;
}

/* ============================================================
   5. RENDER
   ============================================================ */
function visibleCards(){
  const q = ($('#search').value || '').trim().toLowerCase();
  let list = Object.values(state.cards);

  if(state.active !== 'ALL'){
    const deck = state.decks.find(d => d.id === state.active);
    const set = new Set(deck ? deck.cards : []);
    list = list.filter(c => set.has(c.id));
  }
  if(q){
    list = list.filter(c =>
      (c.name+' '+c.pos+' '+c.team+' '+teamOf(c.team)[0]+' '+(c.bio||''))
        .toLowerCase().includes(q));
  }
  return list.sort((a,b)=>(a.no||999)-(b.no||999) || a.name.localeCompare(b.name));
}

function renderDeckBar(){
  const bar = $('#deckBar');
  const total = Object.keys(state.cards).length;
  let html = `<button class="chip" data-deck="ALL" aria-selected="${state.active==='ALL'}">
    All Cards <span class="n">${total}</span></button>`;
  state.decks.forEach(d=>{
    html += `<button class="chip" data-deck="${d.id}" aria-selected="${state.active===d.id}">

function cardHTML(c){

function render(){
  renderDeckBar();
  const stack = state.view === 'stack';
  document.body.classList.toggle('stackmode', stack);
  $('#viewBtn').textContent = stack ? '⊞' : '▤';
  $('#viewBtn').title = stack ? 'Back to the grid' : 'Flip through the stack';
  if(stack) renderStack(); else renderGrid();
}

function renderGrid(){
  const list = visibleCards();
  const grid = $('#grid');
  if(!list.length){
    const inDeck = state.active !== 'ALL';
    const q = ($('#search').value || '').trim();
    grid.innerHTML = `<div class="empty">
      <h2>${q ? `Nobody called “${esc(q)}” here` : (inDeck ? 'This deck is empty' : 'No cards found')}</h2>
      <p>${q
        ? 'He might be real, though — pull his card straight out of ESPN.'
        : (inDeck ? 'Flip any card and hit <b>Decks</b> to add it here.'
                  : 'Try a different search, or make a card of your own.')}</p>

      <button class="btn ${q ? 'ghost' : ''}" onclick="openEditor()">+ New card</button>
    </div>`;
    return;

/* ============================================================
   6. INTERACTIONS
   ============================================================ */
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-deck]');
  if(chip){ state.active = chip.dataset.deck; save(); render(); return; }
  if(e.target.closest('[data-new-deck]')){ newDeck(); return; }

  const tool = e.target.closest('.backtools button');
  if(tool){
    e.stopPropagation();
    const id = tool.closest('.card').dataset.id;
    const act = tool.dataset.act;
    if(act === 'refresh') refreshCard(id, tool);
    if(act === 'decks')   openDeckPicker(id);
    if(act === 'edit')    openEditor(id);
    return;
  }
  if(e.target.closest('[data-scout]')){ scoutPlayer($('#search').value); return; }
  if(e.target.closest('.newsbox a')) { e.stopPropagation(); return; }

  const card = e.target.closest('.card');
  if(card){
    // In the stack a tap is the tail end of a drag gesture, so the pointer
    // handlers below decide whether it was a flip. Clicking here too would
    // flip it straight back.
    if(card.closest('.stage')) return;
    flipCard(card.dataset.id, card);
  }
});

function flipCard(id, el){
  state.flipped[id] = !state.flipped[id];
  el.classList.toggle('flipped');
  save();
}

$('#search').addEventListener('input', render);
$('#addCardBtn').addEventListener('click', ()=>openEditor());
$('#fab').addEventListener('click', ()=>openEditor());
$('#menuBtn').addEventListener('click', openMenu);
$('#viewBtn').addEventListener('click', ()=>{
  state.view = state.view === 'stack' ? 'grid' : 'stack';
  save(); render();
});

/* ============================================================
   6b. THE STACK
   Drag the top card left to pass, right to file it into a deck.
   Buttons and arrow keys do the same thing for anyone not swiping.
   ============================================================ */
const SWIPE_AT = 92;            // px past which a release commits
let stackIdx  = 0;              // how far into the current list we are
let stackHist = [];             // {id, deckId|null} — enough to undo a swipe
let stackSig  = null;           // list identity; changes reset our place
let drag = null;

const topCard = () => $('.stage .card[data-depth="0"]');

function renderFiling(){
  const sel = $('#fileTo');
  if(!state.decks.some(d => d.id === state.fileTo)) state.fileTo = state.decks[0]?.id || null;
  sel.innerHTML = state.decks.map(d =>
    `<option value="${d.id}"${d.id===state.fileTo?' selected':''}>${esc(d.name)} · ${d.cards.length}</option>`
  ).join('') + '<option value="__new">+ New deck…</option>';
}

function renderStack(){
  const list = visibleCards();

  // Searching or switching decks builds a different pile — start it at the top.
  const sig = state.active + '␀' + ($('#search').value || '');
  if(sig !== stackSig){ stackSig = sig; stackIdx = 0; stackHist = []; }
  if(stackIdx > list.length) stackIdx = list.length;

  renderFiling();
  const stage = $('#stage'), done = $('#stackDone');
  const left  = Math.max(0, list.length - stackIdx);

  $('#stackCount').textContent = list.length
    ? `${Math.min(stackIdx + 1, list.length)} of ${list.length}`
    : 'empty';
  $('#swUndo').disabled = !stackHist.length;
  $('#swPass').disabled = $('#swFile').disabled = !left;

  if(!left){
    stage.innerHTML = '';
    done.hidden = false;
    done.innerHTML = list.length
      ? `<h2>End of the stack</h2>
         <p>${list.length} card${list.length===1?'':'s'} sorted.</p>
         <button class="btn ghost" id="restack">↺ Run it again</button>`
      : `<h2>${state.active === 'ALL' ? 'No cards found' : 'This deck is empty'}</h2>
         <p>${state.active === 'ALL'
              ? 'Try a different search, or make a card of your own.'
              : 'Swipe cards right from All Cards to fill it.'}</p>
         ${($('#search').value || '').trim()
              ? `<button class="btn" data-scout>🔎 Scout “${esc($('#search').value.trim())}”</button>` : ''}`;
    const again = done.querySelector('#restack');
    if(again) again.onclick = ()=>{ stackIdx = 0; stackHist = []; renderStack(); };
    return;
  }

  done.hidden = true;
  // Deepest first in the DOM so the live card is painted last.
  const slice = [];
  for(let i = 0; i < 3 && list[stackIdx + i]; i++) slice.push(list[stackIdx + i]);
  stage.innerHTML = slice.slice().reverse().map(cardHTML).join('');
  [...stage.querySelectorAll('.card')].forEach((el, i) => {
    el.dataset.depth = String(slice.length - 1 - i);
  });
  clearStamps();
}

function clearStamps(){
  $('#stampPass').style.opacity = $('#stampFile').style.opacity = 0;
}

/* ----- dragging ----- */
$('#stage').addEventListener('pointerdown', e => {
  const top = topCard();
  if(!top || !top.contains(e.target)) return;
  if(e.target.closest('.backtools button, .newsbox a')) return;   // let the tools work
  drag = {el:top, x0:e.clientX, y0:e.clientY, dx:0, dy:0, moved:false, pid:e.pointerId};
  top.classList.remove('settling');
  top.style.animation = 'none';        // the entry animation would fight the drag
  try{ top.setPointerCapture(e.pointerId); }catch(err){ /* capture is a nicety */ }
});

$('#stage').addEventListener('pointermove', e => {
  if(!drag || e.pointerId !== drag.pid) return;
  drag.dx = e.clientX - drag.x0;
  drag.dy = e.clientY - drag.y0;
  if(Math.abs(drag.dx) > 6 || Math.abs(drag.dy) > 6) drag.moved = true;
  drag.el.style.transform =
    `translate(${drag.dx}px, ${drag.dy * .32}px) rotate(${drag.dx / 18}deg)`;
  const t = Math.min(1, Math.abs(drag.dx) / SWIPE_AT);
  $('#stampFile').style.opacity = drag.dx > 0 ? t : 0;
  $('#stampPass').style.opacity = drag.dx < 0 ? t : 0;
});

function springBack(el){
  el.classList.add('settling');
  el.style.transform = '';
  clearStamps();
}

function endDrag(e){
  if(!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;

  if(!d.moved){                                   // never really moved — it's a tap
    clearStamps(); d.el.style.transform = '';
    flipCard(d.el.dataset.id, d.el);
    return;
  }
  if(Math.abs(d.dx) > SWIPE_AT){ commitSwipe(d.dx > 0 ? 'file' : 'pass', d.el); return; }
  springBack(d.el);                               // short of the line
}

/* The browser can take a gesture away from us mid-swipe. Whatever we had is
   not a decision the reader made, so put the card back rather than file it. */
function abortDrag(e){
  if(!drag || (e && e.pointerId !== drag.pid)) return;
  const d = drag; drag = null;
  springBack(d.el);
}

$('#stage').addEventListener('pointerup', endDrag);
$('#stage').addEventListener('pointercancel', abortDrag);
$('#stage').addEventListener('dragstart', e => e.preventDefault());

/* ----- committing ----- */
function commitSwipe(kind, el){
  const card = visibleCards()[stackIdx];
  if(!card) return;

  let filedTo = null;
  if(kind === 'file'){
    const d = state.decks.find(x => x.id === state.fileTo);
    if(!d){
      toast('Make a deck to file into first');
      if(el){ el.classList.add('settling'); el.style.transform = ''; }
      clearStamps();
      return;
    }
    if(!d.cards.includes(card.id)){ d.cards.push(card.id); filedTo = d.id; }
    toast(`${card.name} → ${d.name}`);
  }
  stackHist.push({id:card.id, deckId:filedTo});
  stackIdx++;
  save();
  clearStamps();

  if(!el){ renderStack(); renderDeckBar(); return; }
  el.classList.add('gone');
  el.style.transform = `translate(${kind === 'file' ? 520 : -520}px, 60px)
                        rotate(${kind === 'file' ? 24 : -24}deg)`;
  setTimeout(()=>{ renderStack(); renderDeckBar(); }, 200);
}

function undoSwipe(){
  const last = stackHist.pop();
  if(!last) return;
  if(last.deckId){
    const d = state.decks.find(x => x.id === last.deckId);
    if(d) d.cards = d.cards.filter(x => x !== last.id);
  }
  stackIdx = Math.max(0, stackIdx - 1);
  save(); renderStack(); renderDeckBar();
  toast('Put back');
}

$('#swPass').addEventListener('click', ()=>commitSwipe('pass', topCard()));
$('#swFile').addEventListener('click', ()=>commitSwipe('file', topCard()));
$('#swUndo').addEventListener('click', undoSwipe);
$('#fileTo').addEventListener('change', e => {
  if(e.target.value === '__new'){ newDeck({fileInto:true}); return; }
  state.fileTo = e.target.value;
  save();
});

document.addEventListener('keydown', e => {
  if(state.view !== 'stack' || $('.scrim')) return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement?.tagName || '')) return;
  if(e.key === 'ArrowLeft'){ e.preventDefault(); commitSwipe('pass', topCard()); }
  else if(e.key === 'ArrowRight'){ e.preventDefault(); commitSwipe('file', topCard()); }
  else if(e.key === 'Backspace'){ e.preventDefault(); undoSwipe(); }
  else if(e.key === ' ' || e.key === 'Enter'){
    const t = topCard(); if(t){ e.preventDefault(); flipCard(t.dataset.id, t); }
  }
});

/* ============================================================
   7. DECKS
   ============================================================ */
/* opts.fileInto — made from the stack's "Filing into" picker, so the new deck
   becomes the swipe-right target instead of the deck you're browsing. */
function newDeck(opts = {}){
  const name = prompt('Name your deck', 'My Deck');
  if(!name){ if(opts.fileInto) renderFiling(); return; }   // put the picker back
  const d = {id:uid('d_'), name:name.trim().slice(0,40), cards:[]};
  state.decks.push(d);
  if(opts.fileInto) state.fileTo = d.id; else state.active = d.id;
  save(); render();
  toast('Deck created');
}

function openDeckPicker(cardId){
  const card = state.cards[cardId];
  const rows = state.decks.map(d=>`
    <label class="deckrow">
      <input type="checkbox" data-deck-id="${d.id}" ${d.cards.includes(cardId)?'checked':''}>
      <span>${esc(d.name)}</span><small>${d.cards.length}</small>
    </label>`).join('');

  modal(`
    <h3>Add “${esc(card.name)}” to…</h3>
    <div class="decklist">${rows || '<p class="hint">No decks yet.</p>'}</div>
    <button class="btn ghost" id="mkDeck" style="width:100%;margin-top:6px">+ New deck</button>
    <div class="actions"><button class="btn" id="done">Done</button></div>
  `, root => {
    root.querySelectorAll('[data-deck-id]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const d = state.decks.find(x=>x.id===cb.dataset.deckId);
        if(cb.checked){ if(!d.cards.includes(cardId)) d.cards.push(cardId); }
        else d.cards = d.cards.filter(x=>x!==cardId);
        save(); renderDeckBar();
      });
    });
    root.querySelector('#mkDeck').onclick = ()=>{ closeModal(); newDeck(); };
    root.querySelector('#done').onclick = ()=>{ closeModal(); render(); };
  });
}

/* Deal a whole side of the ball into its own deck — the Cowboys offense
   in two taps instead of swiping forty guys one at a time. */
const SIDES = {
  offense: {label:'Offense',    set:new Set(['QB','RB','FB','WR','TE','OT','T','G','C','OL'])},
  defense: {label:'Defense',    set:new Set(['DE','EDGE','DT','NT','LB','OLB','ILB','MLB','CB','S','FS','SS','DB'])},
  squad:   {label:'Full squad', set:null}
};

function openTeamDeck(){
  const counts = {};
  Object.values(state.cards).forEach(c => {
    if(c.team && c.team !== 'FA') counts[c.team] = (counts[c.team] || 0) + 1;
  });
  const teams = Object.keys(counts).sort();
  if(!teams.length){ toast('No team cards yet — import the league first'); return; }

  const teamOpts = teams.map(t =>
    `<option value="${t}">${t} — ${esc(teamOf(t)[0])} · ${counts[t]}</option>`).join('');
  const sideOpts = Object.entries(SIDES).map(([k,s]) =>
    `<option value="${k}">${s.label}</option>`).join('');

  modal(`
    <h3>Team deck</h3>
    <p class="hint" style="margin:-4px 0 14px">
      Deals every card you have for a team into its own deck, sorted the way a
      program would print them. Run the league import first and this draws
      from real rosters instead of the starter pack.</p>
    <div class="row">
      <div class="field"><label>Team</label><select id="t_team">${teamOpts}</select></div>
      <div class="field"><label>Who</label><select id="t_side">${sideOpts}</select></div>
    </div>
    <div class="actions">
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" id="go">Deal the deck</button>
    </div>
  `, root => {
    root.querySelector('#cancel').onclick = closeModal;
    root.querySelector('#go').onclick = () => {
      const d = buildTeamDeck(root.querySelector('#t_team').value,
                              root.querySelector('#t_side').value);
      closeModal();
      toast(d.cards.length ? `${d.name} — ${d.cards.length} cards` : `${d.name} came up empty`);
    };
  });
}

function buildTeamDeck(team, side){
  const wanted = SIDES[side].set;
  const rank = c => { const i = POS_RANK.indexOf(c.pos); return i === -1 ? 99 : i; };
  // coaches ride with the full squad only — `wanted` is null there
  const members = Object.values(state.cards)
    .filter(c => c.team === team && (!wanted || wanted.has(c.pos)))
    .sort((a,b) => rank(a) - rank(b) ||
      String(a.jersey).localeCompare(String(b.jersey), undefined, {numeric:true}))
    .map(c => c.id);

  const name = side === 'squad' ? `${team} Full Squad` : `${team} ${SIDES[side].label}`;
  let d = state.decks.find(x => x.name === name);
  if(!d){ d = {id:uid('d_'), name, cards:[]}; state.decks.push(d); }
  d.cards = members;                 // dealt fresh every time — re-run after an import
  state.active = d.id;
  save(); render();
  return d;
}

/* ============================================================
   8. CARD EDITOR
   ============================================================ */

    .map(([ab,[nm]])=>`<option value="${ab}" ${c && c.team===ab?'selected':''}>${ab} — ${nm}</option>`)
    .join('');

  modal(`
    <h3>${c ? 'Edit card' : 'New card'}</h3>
    <div class="field"><label>Name</label>
      <input id="f_name" value="${esc(c?.name||'')}" placeholder="Player, coach, anybody"></div>
    <div class="row">
      <div class="field"><label>Team</label><select id="f_team">${teamOpts}</select></div>
      <div class="field"><label>Position</label>
        <input id="f_pos" value="${esc(c?.pos||'')}" placeholder="QB / HC / GM" maxlength="4"></div>
      <div class="field" style="max-width:82px"><label>No.</label>
        <input id="f_jersey" value="${esc(c?.jersey??'')}" placeholder="00" maxlength="2"></div>
    </div>
    <div class="field"><label>Photo</label>
      <input id="f_photo" value="${esc(c?.photo||'')}" placeholder="Paste an image URL…">

    </div>
    <p class="hint">Leave blank and we'll try the official headshot, then fall back to a
      classic silhouette.</p>
    <div class="field"><label>Bio line</label>
      <input id="f_bio" value="${esc(c?.bio||'')}" placeholder="6-2 · 225 · Texas Tech"></div>
    <div class="field"><label>Stats — one per line, “Label: Value”</label>
      <textarea id="f_stats" rows="4" placeholder="Pro Bowls: 6&#10;Career TD: 250+">${esc(statText)}</textarea></div>
    <div class="field"><label>Note / caption</label>
      <textarea id="f_note" rows="2" placeholder="Your scouting take">${esc(c?.note||'')}</textarea></div>
    <div class="actions">
      ${c ? '<button class="btn ghost danger" id="del">Delete</button>' : ''}
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" id="ok">Save</button>
    </div>
  `, root => {
    const fileEl = root.querySelector('#f_file');
    let uploaded = null;
    fileEl.addEventListener('change', async ()=>{
      const f = fileEl.files[0]; if(!f) return;
      try{ uploaded = await shrinkImage(f); toast('Photo attached'); }
      catch(err){ toast('Could not read that image'); }
    });

    root.querySelector('#ok').onclick = ()=>{
      const name = root.querySelector('#f_name').value.trim();
      if(!name){ toast('Give the card a name'); return; }
      const stats = root.querySelector('#f_stats').value.split('\n')
        .map(l=>l.trim()).filter(Boolean)
        .map(l=>{ const i = l.indexOf(':');
          return i<0 ? {k:l, v:''} : {k:l.slice(0,i).trim(), v:l.slice(i+1).trim()}; });

      const data = {
        name,
        team: root.querySelector('#f_team').value,
        pos:  root.querySelector('#f_pos').value.trim().toUpperCase(),
        jersey: root.querySelector('#f_jersey').value.trim(),
        photo: uploaded || root.querySelector('#f_photo').value.trim() || null,
        bio:  root.querySelector('#f_bio').value.trim(),
        note: root.querySelector('#f_note').value.trim(),
        stats
      };

      if(c){ Object.assign(c, data); }
      else{
        const nid = uid('c_');
        const nextNo = Object.keys(state.cards).length + 1;
        state.cards[nid] = {id:nid, no:nextNo, espnId:null, honors:'', live:null, ...data};
        if(state.active !== 'ALL'){
          const d = state.decks.find(x=>x.id===state.active);
          if(d) d.cards.push(nid);
        }
      }
      closeModal(); save(); render();
      toast(c ? 'Card updated' : 'Card added');
    };

    root.querySelector('#cancel').onclick = closeModal;
    const delBtn = root.querySelector('#del');
    if(delBtn) delBtn.onclick = ()=>{
      if(!confirm(`Delete “${c.name}”? This can't be undone.`)) return;
      delete state.cards[c.id];
      state.decks.forEach(d => d.cards = d.cards.filter(x=>x!==c.id));
      closeModal(); save(); render();
      toast('Card deleted');
    };
  });
}

/* Downscale uploads so localStorage doesn't blow its quota. */
function shrinkImage(file, max = 640){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width  = Math.round(img.width  * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   9. LIVE REFRESH — stats + latest news
   Uses ESPN's public endpoints. Entirely optional: if the
   network, CORS or a firewall says no, the card keeps its
   bundled content and offers a news search link instead.
   ============================================================ */
async function refreshCard(id, btn){
  const c = state.cards[id];
  if(!c) return;
  btn.classList.add('busy');
  btn.textContent = '⟳ …';

  try{
    if(!c.espnId) c.espnId = await lookupEspnId(c.name);
    if(!c.espnId) throw new Error('no-id');

    const live = await fetchLive(c.espnId);
    if(!live.stats && !live.news) throw new Error('empty');
    c.live = {...(c.live||{}), ...live};
    save(); render();
    toast('Updated ' + c.name);
  }catch(err){
    console.warn('Live refresh unavailable:', err);
    btn.classList.remove('busy');
    btn.textContent = '⟳ Refresh';
    toast('Live data unavailable — using the card');
  }
}

/** One player's recent stats + a headline, ready for the back of a card. */
async function fetchLive(espnId){
  const r = await fetch(
    `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${espnId}/overview`,
    {headers:{'Accept':'application/json'}});
  if(!r.ok) throw new Error('http-' + r.status);
  return extractLive(await r.json());
}

/* Pull stats + a headline out of ESPN's payload. Their shape shifts
   between endpoints and positions, so this stays deliberately loose:
   anything it can't find simply doesn't get replaced on the card. */
function extractLive(data){
  const live = {};
  if(!data || typeof data !== 'object') return live;

  // stats — labels and values often sit at different depths
  const root = data.statistics ||
    deepFind(data, n => ((n.labels || n.names) && (n.splits || n.stats)) ? n : null);
  if(root){
    const labels = root.labels || root.names || root.displayNames || [];
    const vals   = root.splits?.stats || root.splits?.[0]?.stats || root.stats || [];
    if(labels.length && vals.length){
      live.stats = labels.slice(0,5).map((k,i)=>({
        k: String(k).toUpperCase(), v: String(vals[i] ?? '—')
      }));
    }
  }

  // news — first node that reads like a headline
  const item = deepFind(data, n => {
    const t = n.description || n.headline;
    return (typeof t === 'string' && t.length > 25) ? n : null;
  });
  if(item){
    const text = String(item.description || item.headline);
    live.news = {
      text: text.length > 200 ? text.slice(0,197).trimEnd() + '…' : text,
      src : 'ESPN · ' + (item.published
        ? new Date(item.published).toLocaleDateString(undefined,{month:'short',day:'numeric'})
        : 'latest')
    };
  }
  return live;
}

/* Best-effort name → ESPN id lookup. Tries a couple of known search
   endpoints and digs the id out of whatever shape comes back. */
async function lookupEspnId(name){
  const urls = [
    'https://site.web.api.espn.com/apis/common/v3/search?limit=5&sport=football&league=nfl&query=',
    'https://site.api.espn.com/apis/common/v3/search?limit=5&sport=football&league=nfl&query='
  ];
  for(const base of urls){
    try{
      const r = await fetch(base + encodeURIComponent(name));
      if(!r.ok) continue;
      const id = deepFind(await r.json(), node => {
        const type = String(node.type || '').toLowerCase();
        const uid  = String(node.uid || '');
        if(type === 'athlete' || type === 'player' || /~a:\d+/.test(uid)){
          const m = uid.match(/~a:(\d+)/);
          return m ? m[1] : (node.id ? String(node.id) : null);
        }
        return null;
      });
      if(id) return id;
    }catch(e){ /* try the next one */ }
  }
  return null;
}

/* Walk an unknown JSON shape and return the first node `pick` likes. */
function deepFind(obj, pick, depth = 0){
  if(!obj || typeof obj !== 'object' || depth > 7) return null;
  if(Array.isArray(obj)){
    for(const v of obj){ const r = deepFind(v, pick, depth+1); if(r) return r; }
    return null;
  }
  const hit = pick(obj);
  if(hit) return hit;
  for(const k in obj){ const r = deepFind(obj[k], pick, depth+1); if(r) return r; }
  return null;
}

/* A headshot 404'd — most likely our bundled id is stale. Try to resolve
   the real one from the player's name, once, then remember it. */
async function photoFail(img, id){
  const silo = img.nextElementSibling;
  img.hidden = true;
  if(silo) silo.hidden = false;

  const c = state.cards[id];
  if(!c || c.photo || c.healed) return;
  c.healed = true;                       // never loop on this card again

  const found = await lookupEspnId(c.name);
  if(!found || found === c.espnId) { save(); return; }

  c.espnId = found; save();
  const url = photoURL(c);
  if(!url) return;
  img.onload = () => { img.hidden = false; if(silo) silo.hidden = true; };
  img.src = url;
}

/* ============================================================
   9b. IMPORT THE LEAGUE
   Pulls every roster from ESPN's public endpoints once, caches the
   headshots on this device, and never asks the network again. This is
   the same job scripts/bake-cards.mjs does, run from the app instead
   of a terminal.
   ============================================================ */
const ESPN = {
  site: 'https://site.api.espn.com/apis/site/v2/sports/football/nfl',
  core: 'https://sports.core.api.espn.com/v2/sports/football/leagues/nfl',
  cdn : 'https://a.espncdn.com/combiner/i?img=/i/headshots/nfl/players/full'
};

/* Skill players and pass rushers make better cards than guards. */
const POS_RANK = ['QB','RB','WR','TE','FB','DE','EDGE','LB','OLB','ILB','MLB',
                  'CB','S','FS','SS','DT','NT','K','P','OT','G','C','LS'];

let importAbort = false;

async function grab(url){
  const r = await fetch(url, {headers:{accept:'application/json'}});
  if(!r.ok) throw new Error('HTTP ' + r.status);
  return r.json();
}

/** Run tasks with a ceiling on how many are in flight. */
async function pool(items, limit, fn){
  const out = new Array(items.length);
  let next = 0;
  await Promise.all(Array.from({length: Math.min(limit, items.length)}, async () => {
    while(next < items.length && !importAbort){
      const i = next++;
      try{ out[i] = await fn(items[i], i); }catch(e){ out[i] = null; }
    }
  }));
  return out;
}

async function fetchTeams(){
  const j = await grab(`${ESPN.site}/teams`);
  return (j?.sports?.[0]?.leagues?.[0]?.teams ?? [])
    .map(t => t.team).filter(t => t?.abbreviation)
    .map(t => ({
      id: String(t.id), abbrev: t.abbreviation.toUpperCase(),
      name: t.name || t.displayName, location: t.location || '',
      c1: t.color ? `#${t.color}` : null, c2: t.alternateColor ? `#${t.alternateColor}` : null
    }));
}

async function fetchRoster(team, perTeam){
  const j = await grab(`${ESPN.site}/teams/${team.abbrev.toLowerCase()}/roster`);
  const groups = Array.isArray(j?.athletes) ? j.athletes : [];
  let players = groups
    .flatMap(g => Array.isArray(g?.items) ? g.items : (g?.id ? [g] : []))
    .filter(a => a?.id && (a.fullName || a.displayName))
    .map(a => ({
      id: `espn_${a.id}`, espnId: String(a.id),
      name: a.fullName || a.displayName, team: team.abbrev,
      pos: (a.position?.abbreviation || '').toUpperCase(),
      jersey: a.jersey ?? '',
      photoRemote: a.headshot?.href || `${ESPN.cdn}/${a.id}.png&w=350&h=254`,
      bio: [a.displayHeight, a.displayWeight, a.college?.name].filter(Boolean).join(' · '),
      stats: [
        ['Age', a.age],
        ['Experience', a.experience?.years != null
          ? (a.experience.years === 0 ? 'Rookie' : `${a.experience.years} yrs`) : null],
        ['College', a.college?.name]
      ].filter(([,v]) => v != null && v !== '').map(([k,v]) => ({k, v:String(v)}))
    }))
    .filter(p => p.pos);

  if(perTeam > 0){
    const rank = p => { const i = POS_RANK.indexOf(p.pos); return i === -1 ? 99 : i; };
    players.sort((a,b) => rank(a) - rank(b));
    players = players.slice(0, perTeam);
  }
  return players;
}

/** Coaches sit behind $ref links, and many have no headshot at all. */
async function fetchCoaches(team, year){
  const idx = await grab(`${ESPN.core}/seasons/${year}/teams/${team.id}/coaches`)
    .catch(() => null);
  const refs = (idx?.items ?? []).map(i => i.$ref).filter(Boolean).slice(0, 1);
  const people = await pool(refs, 1, ref => grab(ref.replace(/^http:/, 'https:')));
  return people.filter(Boolean).map(c => {
    const name = [c.firstName, c.lastName].filter(Boolean).join(' ') || c.displayName;
    if(!name) return null;
    return {
      id: `coach_${c.id ?? team.abbrev}`, espnId: c.id ? String(c.id) : null,
      name, team: team.abbrev, pos: 'HC', jersey: '',
      photoRemote: c.headshot?.href || null,
      bio: `Head Coach · ${team.location} ${team.name}`.trim(),
      stats: c.experience?.years != null ? [{k:'Experience', v:`${c.experience.years} yrs`}] : []
    };
  }).filter(Boolean);
}

/** Cache one headshot as a blob. Returns true if it landed on the device. */
async function cachePhoto(card){
  const url = card.espnId ? `${ESPN.cdn}/${card.espnId}.png&w=350&h=254` : card.photoRemote;
  if(!url || !card.espnId) return false;
  try{
    const r = await fetch(url);
    if(!r.ok) return false;
    const blob = await r.blob();
    if(blob.size < 512) return false;          // ESPN's "no photo" placeholder
    await vaultPut(card.espnId, blob);
    return true;
  }catch(e){ return false; }                   // CORS or offline — keep the remote URL
}

async function importLeague({perTeam = 16, withPhotos = true}, report){
  importAbort = false;
  const year = new Date().getFullYear();

  report('Asking ESPN for the league…', 0);
  const teams = await fetchTeams();
  if(!teams.length) throw new Error('no-teams');

  const merged = [];
  let done = 0;
  await pool(teams, 4, async t => {
    const [players, staff] = await Promise.all([
      fetchRoster(t, perTeam).catch(() => []),
      fetchCoaches(t, year).catch(() => [])
    ]);
    merged.push(...players, ...staff);
    report(`Rosters — ${++done} of ${teams.length} teams`, (done / teams.length) * 45);
  });
  if(importAbort) throw new Error('cancelled');
  if(!merged.length) throw new Error('no-players');

  // ESPN's colours sometimes pick a light primary that makes the pennant
  // unreadable, so we only take them for teams we don't already style.
  teams.forEach(t => { if(!TEAMS[t.abbrev] && t.c1 && t.c2) TEAMS[t.abbrev] = [t.name, t.c1, t.c2]; });

  let cached = 0;
  if(withPhotos){
    let p = 0;
    await pool(merged, 6, async card => {
      if(await cachePhoto(card)) cached++;
      if(++p % 5 === 0 || p === merged.length)
        report(`Photos — ${p} of ${merged.length}`, 45 + (p / merged.length) * 50);
    });
    if(importAbort) throw new Error('cancelled');
    await loadVault();
  }

  report('Filing the cards…', 97);

  // Keep the cards you made yourself — and scouted players the import
  // didn't bring back — and replace the rest with the real league.
  const importedNames = new Set(merged.map(c => c.name.toLowerCase()));
  const importedIds   = new Set(merged.map(c => c.id));
  const mine = {};
  Object.values(state.cards).forEach(c => {
    const id = String(c.id);
    if(id.startsWith('c_')) mine[id] = c;
    else if(id.startsWith('espn_') && !importedIds.has(id) &&
            !importedNames.has(String(c.name).toLowerCase())) mine[id] = c;
  });

  const prev = {};
  Object.values(state.cards).forEach(c => { prev[String(c.name).toLowerCase()] = c; });

  const byName = {};
  const fresh = {};
  merged.forEach((c, i) => {
    const was = prev[c.name.toLowerCase()];
    fresh[c.id] = {
      ...c, no: i + 1, live: null, photo: null,
      honors: was?.honors || '', note: was?.note || ''   // keep hand-written flavour
    };
    byName[c.name.toLowerCase()] = c.id;
  });

  // follow decks across by name so your stacks survive the swap
  state.decks = state.decks.map(d => ({
    ...d,
    cards: [...new Set((d.cards || []).map(old =>
      mine[old] ? old : (byName[String(state.cards[old]?.name).toLowerCase()] || null)
    ).filter(Boolean))]
  }));

  state.cards  = {...fresh, ...mine};
  state.flipped = {};
  state.stamp  = `espn:${merged.length}`;
  save();
  return {cards: merged.length, teams: teams.length, cached};
}

/* ============================================================
   9c. SCOUT — "who IS this guy?"
   Somebody you've never heard of just caught a pass. Type his name;
   if the collection doesn't know him, one tap pulls his card out of
   ESPN — photo, bio, stats, latest headline — and files it, so next
   time he's already local.
   ============================================================ */
async function searchEspnPlayers(q){
  const urls = [
    `https://site.web.api.espn.com/apis/common/v3/search?limit=8&sport=football&league=nfl&query=${encodeURIComponent(q)}`,
    `https://site.web.api.espn.com/apis/search/v2?limit=10&query=${encodeURIComponent(q)}`
  ];
  let lastErr = null, reached = false;
  for(const url of urls){
    try{
      const found = [], seen = new Set();
      // pick() that never "finds" makes deepFind walk the whole payload,
      // collecting every node that reads like an NFL player along the way
      deepFind(await grab(url), node => {
        const uid  = String(node.uid || '');
        const type = String(node.type || '').toLowerCase();
        if(!(type === 'athlete' || type === 'player' || /~a:\d+/.test(uid))) return null;
        if(/s:\d+~/.test(uid) && !/s:20~/.test(uid)) return null;   // other sports
        const id = (uid.match(/~a:(\d+)/) || [])[1] || (node.id ? String(node.id) : null);
        const name = node.displayName || node.name || node.title;
        if(!id || !name || seen.has(id)) return null;
        seen.add(id);
        found.push({id, name, blurb: node.description || node.subtitle || ''});
        return null;
      });
      if(found.length) return found;
      reached = true;                      // ESPN answered — just no hits
    }catch(e){ lastErr = e; }              // try the next shape
  }
  // an empty answer and an unreachable ESPN deserve different messages
  if(!reached && lastErr) throw lastErr;
  return [];
}

/** Full athlete profile → a card in the same shape the league import makes. */
async function fetchAthlete(espnId){
  const j = await grab(
    `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${espnId}`);
  const a = j?.athlete || j;
  const name = a?.fullName || a?.displayName;
  if(!name) throw new Error('no-athlete');
  const team = String(a.team?.abbreviation || 'FA').toUpperCase();
  return {
    id: `espn_${espnId}`, espnId: String(espnId),
    name, team: TEAMS[team] ? team : 'FA',
    pos: (a.position?.abbreviation || '').toUpperCase(),
    jersey: a.jersey ?? '',
    photoRemote: a.headshot?.href || `${ESPN.cdn}/${espnId}.png&w=350&h=254`,
    bio: [a.displayHeight, a.displayWeight, a.college?.name].filter(Boolean).join(' · '),
    stats: [
      ['Age', a.age],
      ['Experience', a.experience?.years != null
        ? (a.experience.years === 0 ? 'Rookie' : `${a.experience.years} yrs`) : null],
      ['College', a.college?.name]
    ].filter(([,v]) => v != null && v !== '').map(([k,v]) => ({k, v:String(v)})),
    honors:'', note:'', photo:null, live:null
  };
}

async function scoutPlayer(q){
  q = (q || '').trim();
  if(q.length < 2){ toast('Type a name to scout'); return; }
  toast(`Scouting “${q}”…`);

  let picks = [];
  try{ picks = await searchEspnPlayers(q); }
  catch(e){
    const raw = String((e && e.message) || e);
    toast(`ESPN wouldn't answer — ${/fetch|load failed|network/i.test(raw)
      ? 'blocked by the browser (CORS or a content blocker)' : raw}`);
    return;
  }
  if(!picks.length){ toast(`ESPN has nobody called “${q}”`); return; }
  if(picks.length === 1) return adoptScout(picks[0].id);

  modal(`
    <h3>Which one?</h3>
    <div class="decklist">${picks.slice(0,6).map(p => `
      <button class="deckrow" data-pick="${esc(p.id)}" style="text-align:left">
        <span>${esc(p.name)}</span><small>${esc(p.blurb)}</small></button>`).join('')}
    </div>
    <div class="actions"><button class="btn ghost" id="cancel">Cancel</button></div>
  `, root => {
    root.querySelector('#cancel').onclick = closeModal;
    root.querySelectorAll('[data-pick]').forEach(b =>
      b.onclick = () => { closeModal(); adoptScout(b.dataset.pick); });
  });
}

async function adoptScout(espnId){
  // already in the shoebox? just deal his card to the front
  const have = Object.values(state.cards).find(c => c.espnId === String(espnId));
  if(have){
    state.active = 'ALL'; $('#search').value = have.name;
    save(); render(); return;
  }

  let card;
  try{ card = await fetchAthlete(espnId); }
  catch(e){ toast(`Could not pull his card — ${String((e && e.message) || e).slice(0, 60)}`); return; }

  card.no = Object.keys(state.cards).length + 1;
  state.cards[card.id] = card;

  // photo into the vault, stats + news onto the back — both best-effort,
  // the card is already real without them
  cachePhoto(card).then(ok => ok && loadVault().then(render)).catch(()=>{});
  fetchLive(card.espnId).then(live => {
    if(live.stats || live.news){ card.live = live; save(); render(); }
  }).catch(()=>{});

  state.active = 'ALL';
  $('#search').value = card.name;      // land right on the new card
  save(); render();
  toast(`🏈 ${card.name} — added to the collection`);
}

        <span>↺ Reset to starter pack</span></button>
    </div>
    <p class="hint" style="margin-top:12px">
      Everything lives in this browser. Export before you clear your history.</p>
    <div class="actions"><button class="btn ghost" id="cancel">Close</button></div>
  `, root => {
    root.querySelector('#cancel').onclick = closeModal;
    root.querySelector('#league').onclick = ()=>{ closeModal(); openImport(); };
    root.querySelector('#teamDeckBtn').onclick = ()=>{ closeModal(); openTeamDeck(); };
    root.querySelector('#scoutBtn').onclick = ()=>{
      closeModal();
      const q = prompt('Who are you looking for?', '');
      if(q) scoutPlayer(q);
    };

    root.querySelector('#exp').onclick = ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gridiron-collection.json';
      a.click(); URL.revokeObjectURL(a.href);
      closeModal(); toast('Exported');
    };

    root.querySelector('#imp').onclick = ()=>{
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = ()=>{
        const f = inp.files[0]; if(!f) return;
        const fr = new FileReader();
        fr.onload = ()=>{
          try{
            const s = JSON.parse(fr.result);
            if(!s.cards || !s.decks) throw new Error('shape');
            state = {flipped:{}, active:'ALL', ...s};
            closeModal(); save(); render(); toast('Collection imported');
          }catch(e){ toast('That file did not look right'); }
        };
        fr.readAsText(f);
      };
      inp.click();
    };

    root.querySelector('#renameDeck').onclick = ()=>{
      if(state.active === 'ALL'){ toast('Pick a deck first'); return; }
      const d = state.decks.find(x=>x.id===state.active);
      const nm = prompt('Rename deck', d.name);
      if(nm){ d.name = nm.trim().slice(0,40); save(); render(); }
      closeModal();
    };

    root.querySelector('#delDeck').onclick = ()=>{
      if(state.active === 'ALL'){ toast('Pick a deck first'); return; }
      const d = state.decks.find(x=>x.id===state.active);
      if(!confirm(`Delete the deck “${d.name}”? The cards themselves stay.`)) return;
      state.decks = state.decks.filter(x=>x.id!==state.active);
      state.active = 'ALL';
      closeModal(); save(); render(); toast('Deck deleted');
    };

    root.querySelector('#reset').onclick = async ()=>{
      if(!confirm('Reset everything back to the starter pack? Your custom cards, decks and cached photos will be lost.')) return;
      localStorage.removeItem(KEY);
      try{ await vaultClear(); }catch(e){ /* nothing cached yet */ }
      PHOTOS.forEach(u => URL.revokeObjectURL(u)); PHOTOS.clear();
      state = load();
      closeModal(); save(); render(); toast('Back to the starter pack');
    };
  });
}

/* ============================================================
   11. MODAL PLUMBING
   ============================================================ */
function modal(html, setup){
  closeModal();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('click', e => { if(e.target === scrim) closeModal(); });
  document.body.appendChild(scrim);
  setup && setup(scrim.querySelector('.sheet'));
  const first = scrim.querySelector('input,select,textarea,button');
  first && first.focus({preventScroll:true});
}
function closeModal(){ document.querySelectorAll('.scrim').forEach(s=>s.remove()); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ============================================================
   12. GO
   ============================================================ */
/* Mount the cached headshots BEFORE the first paint. Rendering first would
   fire a round of requests at ESPN for photos we already have on this
   device — which is the whole thing we're trying to avoid. The race is a
   backstop so a wedged IndexedDB can never leave the screen blank. */
Promise.race([loadVault(), new Promise(r => setTimeout(r, 1500))])
  .then(() => { render(); save(); });
</script>
</body>
