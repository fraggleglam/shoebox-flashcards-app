<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1c1a17">
<title>Gridiron — NFL Flash Cards</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
/* ============================================================
   GRIDIRON — retro bubblegum NFL flash cards
   One file. No build step. No API keys. Saves to localStorage.
   ============================================================ */

:root{
  --stock:#f2e8d2;          /* card stock cream */
  --stock-dim:#e4d7bb;
  --ink:#1b1a17;
  --ink-soft:#5a5344;
  --felt:#1c1a17;           /* app background */
  --felt-2:#262320;
  --rule:#c9b990;
  --accent:#d8a32b;
  --radius:14px;
  --card-w:224px;
  --safe-b:env(safe-area-inset-bottom,0px);
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;
  background:
    radial-gradient(1200px 600px at 50% -10%, #2f2b26 0%, transparent 60%),
    var(--felt);
  color:var(--stock);
  font-family:ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:none;cursor:pointer}
input,select,textarea{font:inherit}

/* ---------- top bar ---------- */
.bar{
  position:sticky;top:0;z-index:40;
  display:flex;align-items:center;gap:10px;
  padding:12px 14px 10px;
  background:linear-gradient(180deg,rgba(28,26,23,.97),rgba(28,26,23,.86));
  backdrop-filter:blur(10px);
  border-bottom:1px solid #3a352e;
}
.brand{
  font-family:Impact,"Haettenschweiler","Arial Narrow Bold",Oswald,sans-serif;
  font-size:22px;letter-spacing:.06em;text-transform:uppercase;
  color:var(--stock);line-height:1;white-space:nowrap;
}
.brand em{
  display:block;font:500 9px/1.2 ui-sans-serif,sans-serif;font-style:normal;
  letter-spacing:.24em;color:var(--accent);margin-top:3px;
}
.bar .spacer{flex:1}
.search{
  flex:1;min-width:0;max-width:320px;
  background:#141312;border:1px solid #413b33;border-radius:999px;
  padding:8px 14px;color:var(--stock);outline:none;font-size:14px;
}
.search:focus{border-color:var(--accent)}
.search::placeholder{color:#7d7364}
.iconbtn{
  width:38px;height:38px;border-radius:10px;border:1px solid #413b33;
  background:#141312;display:grid;place-items:center;font-size:16px;flex:none;
}
.iconbtn:hover{border-color:var(--accent)}
.iconbtn.primary{background:var(--accent);color:#20180a;border-color:var(--accent);font-weight:700}

/* ---------- deck rail ---------- */
.decks{
  display:flex;gap:8px;padding:10px 14px;overflow-x:auto;
  scrollbar-width:none;border-bottom:1px solid #302b25;
  position:sticky;top:61px;z-index:35;background:rgba(28,26,23,.94);backdrop-filter:blur(8px);
}
.decks::-webkit-scrollbar{display:none}
.chip{
  flex:none;padding:7px 13px;border-radius:999px;border:1px solid #4a4238;
  background:#211e1a;color:#c8bda6;font-size:13px;white-space:nowrap;
  display:flex;align-items:center;gap:7px;
}
.chip .n{font-size:11px;opacity:.6;font-variant-numeric:tabular-nums}
.chip[aria-selected="true"]{background:var(--stock);color:#1b1a17;border-color:var(--stock);font-weight:600}
.chip[aria-selected="true"] .n{opacity:.55}
.chip.add{border-style:dashed;color:#8e8471}

/* ---------- grid ---------- */
.grid{
  display:grid;gap:18px;padding:18px 14px calc(90px + var(--safe-b));
  grid-template-columns:repeat(auto-fill,minmax(var(--card-w),1fr));
  max-width:1400px;margin:0 auto;
}
.empty{
  grid-column:1/-1;text-align:center;padding:70px 20px;color:#8a8072;
}
.empty h2{font-family:Impact,sans-serif;letter-spacing:.05em;color:#c9bda4;margin:0 0 8px;text-transform:uppercase;font-size:20px}
.empty p{margin:0 0 18px;font-size:14px;line-height:1.6}
.btn{
  display:inline-block;padding:10px 18px;border-radius:10px;
  background:var(--accent);color:#20180a;font-weight:700;font-size:14px;
}
.btn.ghost{background:none;border:1px solid #4a4238;color:#c8bda6;font-weight:500}

/* ---------- the card ---------- */
.card{
  perspective:1400px;aspect-ratio:2.5/3.5;position:relative;
  animation:deal .32s cubic-bezier(.2,.9,.3,1.2) backwards;
}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.96)}}
@media (prefers-reduced-motion:reduce){.card{animation:none}}

.flipper{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .55s cubic-bezier(.3,.9,.3,1);
  cursor:pointer;
}
@media (prefers-reduced-motion:reduce){.flipper{transition:none}}
.card.flipped .flipper{transform:rotateY(180deg)}
/* only the face you're looking at may be clicked */
.card:not(.flipped) .back{pointer-events:none}
.card.flipped .front{pointer-events:none}

.face{
  position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  border-radius:var(--radius);overflow:hidden;
  background:var(--stock);
  box-shadow:0 1px 0 rgba(255,255,255,.35) inset, 0 10px 22px -8px rgba(0,0,0,.75), 0 2px 5px rgba(0,0,0,.4);
}
.face::after{ /* card-stock grain */
  content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;
  background-image:radial-gradient(rgba(120,100,60,.14) .5px,transparent .5px);
  background-size:3px 3px;
}
.back{transform:rotateY(180deg)}

/* ----- FRONT ----- */
.front{padding:9px 9px 0;display:flex;flex-direction:column;background:var(--stock)}
.photo{
  position:relative;flex:1;border-radius:6px;overflow:hidden;
  background:linear-gradient(170deg,var(--c1) 0%,var(--c1) 55%,var(--c2) 100%);
  display:grid;place-items:center;
}
.photo img{
  width:100%;height:100%;object-fit:cover;object-position:50% 12%;display:block;
  filter:saturate(.92) contrast(1.04);
}
.photo img[hidden]{display:none}
/* fallback silhouette when no/blocked photo */
.silo{
  position:absolute;inset:0;display:grid;place-items:center;
  background:
    radial-gradient(70% 55% at 50% 78%, rgba(255,255,255,.16), transparent 70%),
    linear-gradient(170deg,var(--c1),var(--c2));
}
.silo b{
  font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:46px;letter-spacing:.02em;
  color:rgba(255,255,255,.9);text-shadow:0 2px 0 rgba(0,0,0,.28);line-height:1;
}
.silo i{
  position:absolute;bottom:8px;font-style:normal;font-size:9px;letter-spacing:.18em;
  color:rgba(255,255,255,.62);text-transform:uppercase;
}
/* corner pennant with position */
.pennant{
  position:absolute;top:0;left:0;
  background:var(--c1);color:#fff;font:700 10px/1 ui-sans-serif,sans-serif;
  letter-spacing:.12em;padding:6px 12px 6px 8px;text-transform:uppercase;
  clip-path:polygon(0 0,100% 0,calc(100% - 8px) 100%,0 100%);
  text-shadow:0 1px 2px rgba(0,0,0,.5);
  box-shadow:inset 0 -2px 0 var(--c2);
}
.jersey{
  position:absolute;top:7px;right:8px;
  font-family:Impact,"Arial Narrow Bold",sans-serif;font-size:26px;line-height:1;
  color:rgba(255,255,255,.94);text-shadow:0 2px 3px rgba(0,0,0,.45);
}
.nameplate{
  padding:8px 2px 9px;text-align:center;position:relative;
}
.nameplate .nm{
  font-family:Impact,"Haettenschweiler","Arial Narrow Bold",sans-serif;
  font-size:clamp(13px,4.4cqw,17px);letter-spacing:.02em;text-transform:uppercase;
  color:var(--ink);line-height:1.02;
  display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.nameplate .tm{
  display:block;margin-top:3px;font:600 8.5px/1 ui-sans-serif,sans-serif;
  letter-spacing:.2em;text-transform:uppercase;color:var(--c1);
}
.card{container-type:inline-size}
.tape{ /* team color stripe under the photo */
  height:4px;margin-top:6px;border-radius:2px;
  background:linear-gradient(90deg,var(--c1) 0 60%,var(--c2) 60% 100%);
}

/* ----- BACK ----- */
.back{
  background:#efe3c6;
  display:flex;flex-direction:column;padding:11px 11px 9px;
  font-family:Georgia,"Times New Roman",serif;color:#241f16;
}
.back::before{
  content:"";position:absolute;inset:0;opacity:.55;pointer-events:none;
  background-image:radial-gradient(rgba(150,120,60,.18) .6px,transparent .6px);
  background-size:4px 4px;
}
.bhead{display:flex;align-items:flex-start;gap:8px;position:relative}
.cardno{
  flex:none;width:26px;height:26px;border-radius:50%;
  background:var(--c1);color:#fff;display:grid;place-items:center;
  font:700 11px/1 ui-sans-serif,sans-serif;font-variant-numeric:tabular-nums;
  box-shadow:0 1px 2px rgba(0,0,0,.3);
}
.bname{flex:1;min-width:0}
.bname b{
  display:block;font-family:Impact,"Arial Narrow Bold",sans-serif;font-weight:400;
  font-size:14px;letter-spacing:.02em;text-transform:uppercase;line-height:1.06;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.bname span{font:italic 10px/1.3 Georgia,serif;color:#6b5f45;display:block;margin-top:2px}
.bio{
  margin:8px 0 0;font-size:9.5px;line-height:1.45;color:#4f4634;
  border-top:1px solid rgba(120,95,45,.3);border-bottom:1px solid rgba(120,95,45,.3);
  padding:5px 0;position:relative;
}
.statwrap{flex:1;min-height:0;overflow:auto;margin-top:7px;position:relative;scrollbar-width:thin}
.statwrap::-webkit-scrollbar{width:4px}
.statwrap::-webkit-scrollbar-thumb{background:rgba(120,95,45,.35);border-radius:4px}
.slabel{
  font:700 8px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:#8a7a53;display:flex;align-items:center;gap:6px;margin-bottom:4px;
}
.slabel::after{content:"";flex:1;height:1px;background:rgba(120,95,45,.3)}
table.stats{width:100%;border-collapse:collapse;font-family:ui-sans-serif,sans-serif}
table.stats td{
  padding:2.5px 0;font-size:10px;vertical-align:baseline;
  border-bottom:1px dotted rgba(120,95,45,.35);
}
table.stats td:first-child{color:#6b5f45;letter-spacing:.02em}
table.stats td:last-child{text-align:right;font-weight:700;font-variant-numeric:tabular-nums;color:#241f16}
.honors{
  margin-top:7px;font-size:9px;line-height:1.5;color:#5c5139;position:relative;
}
.honors b{font:700 8px/1 ui-sans-serif,sans-serif;letter-spacing:.14em;color:#8a7a53;text-transform:uppercase}

/* the old "cartoon fact" box, repurposed for live news */
.newsbox{
  flex:none;margin-top:7px;border:1.5px solid #7d6a3c;border-radius:5px;
  background:#f8f0da;padding:6px 8px 7px;position:relative;
}
.newsbox p{max-height:54px;overflow:auto;scrollbar-width:thin}
.newsbox .nlab{
  font:700 7.5px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;text-transform:uppercase;
  color:#9a7b2c;display:flex;align-items:center;gap:5px;margin-bottom:3px;
}
.newsbox .nlab .dot{width:5px;height:5px;border-radius:50%;background:#b98b1e;flex:none}
.newsbox .nlab .dot.live{background:#2e8b45;box-shadow:0 0 0 2px rgba(46,139,69,.2)}
.newsbox p{margin:0;font-size:9.5px;line-height:1.42;color:#3b3324}
.newsbox .src{
  display:block;margin-top:4px;font:600 8px/1 ui-sans-serif,sans-serif;
  color:#8a7a53;letter-spacing:.04em;
}
.newsbox a{color:#8a5b12}

.backtools{
  flex:none;display:flex;gap:5px;margin-top:7px;position:relative;
}
.backtools button{
  flex:1;padding:5px 4px;border-radius:5px;border:1px solid rgba(120,95,45,.45);
  background:rgba(255,255,255,.4);
  font:600 8.5px/1.2 ui-sans-serif,sans-serif;letter-spacing:.06em;
  text-transform:uppercase;color:#5c5139;
}
.backtools button:hover{background:#fff;border-color:#7d6a3c}
.backtools button.busy{opacity:.5;pointer-events:none}

/* ---------- modals ---------- */
.scrim{
  position:fixed;inset:0;z-index:80;background:rgba(10,9,8,.72);
  backdrop-filter:blur(4px);display:grid;place-items:center;padding:16px;
  animation:fade .18s ease;
}
@keyframes fade{from{opacity:0}}
.sheet{
  width:min(460px,100%);max-height:88vh;overflow:auto;
  background:#211e1a;border:1px solid #443c32;border-radius:16px;
  padding:20px;box-shadow:0 24px 60px -12px rgba(0,0,0,.8);
}
.sheet h3{
  margin:0 0 16px;font-family:Impact,sans-serif;font-weight:400;
  letter-spacing:.05em;text-transform:uppercase;font-size:17px;color:var(--stock);
}
.field{margin-bottom:12px}
.field label{
  display:block;font:600 9px/1 ui-sans-serif,sans-serif;letter-spacing:.16em;
  text-transform:uppercase;color:#9a8f7c;margin-bottom:5px;
}
.field input,.field select,.field textarea{
  width:100%;padding:9px 11px;border-radius:8px;border:1px solid #443c32;
  background:#161412;color:var(--stock);outline:none;font-size:14px;
}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent)}
.field textarea{resize:vertical;min-height:60px;line-height:1.5}
.row{display:flex;gap:10px}
.row .field{flex:1}
.hint{font-size:11px;color:#8a8072;line-height:1.5;margin:-6px 0 12px}
.actions{display:flex;gap:9px;margin-top:18px}
.actions .btn{flex:1;text-align:center;border:none;cursor:pointer}
.danger{color:#e0755f}

.decklist{display:flex;flex-direction:column;gap:7px;margin-bottom:6px}
.deckrow{
  display:flex;align-items:center;gap:11px;padding:11px 13px;border-radius:10px;
  background:#191715;border:1px solid #3a332b;
}
.deckrow input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent);flex:none}
.deckrow span{flex:1;font-size:14px}
.deckrow small{font-size:11px;color:#847a6a;font-variant-numeric:tabular-nums}

.toast{
  position:fixed;left:50%;bottom:calc(22px + var(--safe-b));transform:translateX(-50%);
  background:var(--stock);color:#1b1a17;padding:10px 18px;border-radius:999px;
  font-size:13px;font-weight:600;z-index:99;box-shadow:0 8px 24px rgba(0,0,0,.5);
  animation:pop .25s cubic-bezier(.2,.9,.3,1.3);
}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}

.fab{
  position:fixed;right:16px;bottom:calc(16px + var(--safe-b));z-index:45;
  width:54px;height:54px;border-radius:50%;background:var(--accent);color:#20180a;
  font-size:26px;display:grid;place-items:center;font-weight:700;
  box-shadow:0 8px 22px -4px rgba(0,0,0,.7);
}
@media(min-width:640px){.fab{display:none}}
@media(max-width:420px){
  .grid{grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:13px;padding:14px 11px 100px}
  .brand{font-size:19px}
}
</style>
</head>
<body>

<header class="bar">
  <div class="brand">Gridiron<em>flash cards</em></div>
  <span class="spacer"></span>
  <input id="search" class="search" type="search" placeholder="Search cards…" autocomplete="off">
  <button class="iconbtn primary" id="addCardBtn" title="New card">+</button>
  <button class="iconbtn" id="menuBtn" title="Menu">⋯</button>
</header>

<nav class="decks" id="deckBar"></nav>
<main class="grid" id="grid"></main>
<button class="fab" id="fab" title="New card">+</button>

/* ============================================================
   3. STATE + STORAGE
   ============================================================ */
const KEY = 'gridiron.v1';
const uid = p => p + Math.random().toString(36).slice(2,9);

let state = load();

function seedCards(){
  const cards = {};
  SEED.forEach((r,i) => {
    const id = 'seed_' + i;
    cards[id] = {
      id, name:r.n, team:r.t, pos:r.p, jersey:r.j, espnId:r.e,
      bio:r.b, stats:r.s.map(([k,v])=>({k,v})), honors:r.h, note:r.w,
      photo:null, no:i+1, live:null
    };
  });
  return cards;
}

function load(){
  try{
    const raw = localStorage.getItem(KEY);
    if(raw){
      const s = JSON.parse(raw);
      if(s && s.cards && s.decks) return s;
    }
  }catch(e){ console.warn('Could not read saved data:', e); }
  return {
    cards: seedCards(),
    decks: [{id:'d_starter', name:'Starter Pack', cards:[]}],
    active: 'ALL',
    flipped: {}
  };
}

let saveTimer;
function save(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(()=>{
    try{ localStorage.setItem(KEY, JSON.stringify(state)); }
    catch(e){ toast('Storage full — try smaller photos'); }
  }, 120);
}

/* ============================================================
   4. HELPERS
   ============================================================ */
const $  = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function teamOf(ab){ return TEAMS[ab] || TEAMS.FA; }
function initials(name){
  return String(name||'?').split(/\s+/).filter(Boolean).slice(0,2)
    .map(w=>w[0]).join('').toUpperCase();
}
function photoURL(c){
  if(c.photo) return c.photo;
  if(c.espnId) return `https://a.espncdn.com/i/headshots/nfl/players/full/${c.espnId}.png`;
  return null;
}
function newsSearchURL(c){
  const t = teamOf(c.team)[0];
  return 'https://news.google.com/search?q=' + encodeURIComponent(`"${c.name}" ${t} NFL`);
}
function toast(msg){
  document.querySelectorAll('.toast').forEach(t=>t.remove());
  const el = document.createElement('div');
  el.className = 'toast'; el.textContent = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(), 2400);
}

/* ============================================================
   5. RENDER
   ============================================================ */
function visibleCards(){
  const q = ($('#search').value || '').trim().toLowerCase();
  let list = Object.values(state.cards);

  if(state.active !== 'ALL'){
    const deck = state.decks.find(d => d.id === state.active);
    const set = new Set(deck ? deck.cards : []);
    list = list.filter(c => set.has(c.id));
  }
  if(q){
    list = list.filter(c =>
      (c.name+' '+c.pos+' '+c.team+' '+teamOf(c.team)[0]+' '+(c.bio||''))
        .toLowerCase().includes(q));
  }
  return list.sort((a,b)=>(a.no||999)-(b.no||999) || a.name.localeCompare(b.name));
}

function renderDeckBar(){
  const bar = $('#deckBar');
  const total = Object.keys(state.cards).length;
  let html = `<button class="chip" data-deck="ALL" aria-selected="${state.active==='ALL'}">
    All Cards <span class="n">${total}</span></button>`;
  state.decks.forEach(d=>{
    html += `<button class="chip" data-deck="${d.id}" aria-selected="${state.active===d.id}">
      ${esc(d.name)} <span class="n">${d.cards.length}</span></button>`;
  });
  html += `<button class="chip add" data-new-deck="1">+ New deck</button>`;
  bar.innerHTML = html;
}

function cardHTML(c){
  const [tname,c1,c2] = teamOf(c.team);
  const src = photoURL(c);
  const flipped = state.flipped[c.id] ? ' flipped' : '';
  const stats = (c.live?.stats || c.stats || []);
  const news  = c.live?.news;

  return `
  <div class="card${flipped}" data-id="${c.id}" style="--c1:${c1};--c2:${c2}">
   <div class="flipper">

    <div class="face front">
      <div class="photo">
        ${src ? `<img src="${esc(src)}" alt="${esc(c.name)}" loading="lazy"
                  onerror="photoFail(this,'${c.id}')">
                <div class="silo" hidden><b>${esc(initials(c.name))}</b><i>${esc(tname)}</i></div>`
              : `<div class="silo"><b>${esc(initials(c.name))}</b><i>${esc(tname)}</i></div>`}
        <div class="pennant">${esc(c.pos||'')}</div>
        ${c.jersey != null && c.jersey !== '' ? `<div class="jersey">${esc(c.jersey)}</div>` : ''}
      </div>
      <div class="tape"></div>
      <div class="nameplate">
        <span class="nm">${esc(c.name)}</span>
        <span class="tm">${esc(tname)}</span>
      </div>
    </div>

    <div class="face back">
      <div class="bhead">
        <div class="cardno">${c.no || '•'}</div>
        <div class="bname">
          <b>${esc(c.name)}</b>
          <span>${esc(c.pos||'')} · ${esc(tname)}</span>
        </div>
      </div>
      ${c.bio ? `<div class="bio">${esc(c.bio)}</div>` : ''}

      <div class="statwrap">
        ${stats.length ? `
          <div class="slabel">${c.live?.stats ? 'Live Stats' : 'Career Card'}</div>
          <table class="stats">
            ${stats.map(s=>`<tr><td>${esc(s.k)}</td><td>${esc(s.v)}</td></tr>`).join('')}
          </table>` : ''}
        ${c.honors ? `<div class="honors"><b>Did you know</b><br>${esc(c.honors)}</div>` : ''}
      </div>

      <div class="newsbox">
        <div class="nlab"><span class="dot${news?' live':''}"></span>${news ? 'Latest' : 'Scouting Note'}</div>
        <p>${esc(news ? news.text : (c.note || 'No note yet — tap Refresh for the latest.'))}</p>
        <span class="src">${news
          ? esc(news.src || 'ESPN')
          : `<a href="${esc(newsSearchURL(c))}" target="_blank" rel="noopener noreferrer">Search the news →</a>`}</span>
      </div>

      <div class="backtools">
        <button data-act="refresh">⟳ Refresh</button>
        <button data-act="decks">Decks</button>
        <button data-act="edit">Edit</button>
      </div>
    </div>

   </div>
  </div>`;
}

function render(){
  renderDeckBar();
  const list = visibleCards();
  const grid = $('#grid');
  if(!list.length){
    const inDeck = state.active !== 'ALL';
    grid.innerHTML = `<div class="empty">
      <h2>${inDeck ? 'This deck is empty' : 'No cards found'}</h2>
      <p>${inDeck
        ? 'Flip any card and hit <b>Decks</b> to add it here.'
        : 'Try a different search, or make a card of your own.'}</p>
      <button class="btn" onclick="openEditor()">+ New card</button>
    </div>`;
    return;
  }
  grid.innerHTML = list.map(cardHTML).join('');
}

/* ============================================================
   6. INTERACTIONS
   ============================================================ */
document.addEventListener('click', e => {
  const chip = e.target.closest('[data-deck]');
  if(chip){ state.active = chip.dataset.deck; save(); render(); return; }
  if(e.target.closest('[data-new-deck]')){ newDeck(); return; }

  const tool = e.target.closest('.backtools button');
  if(tool){
    e.stopPropagation();
    const id = tool.closest('.card').dataset.id;
    const act = tool.dataset.act;
    if(act === 'refresh') refreshCard(id, tool);
    if(act === 'decks')   openDeckPicker(id);
    if(act === 'edit')    openEditor(id);
    return;
  }
  if(e.target.closest('.newsbox a')) { e.stopPropagation(); return; }

  const card = e.target.closest('.card');
  if(card){
    const id = card.dataset.id;
    state.flipped[id] = !state.flipped[id];
    card.classList.toggle('flipped');
    save();
  }
});

$('#search').addEventListener('input', render);
$('#addCardBtn').addEventListener('click', ()=>openEditor());
$('#fab').addEventListener('click', ()=>openEditor());
$('#menuBtn').addEventListener('click', openMenu);

/* ============================================================
   7. DECKS
   ============================================================ */
function newDeck(){
  const name = prompt('Name your deck', 'My Deck');
  if(!name) return;
  const d = {id:uid('d_'), name:name.trim().slice(0,40), cards:[]};
  state.decks.push(d);
  state.active = d.id;
  save(); render();
  toast('Deck created');
}

function openDeckPicker(cardId){
  const card = state.cards[cardId];
  const rows = state.decks.map(d=>`
    <label class="deckrow">
      <input type="checkbox" data-deck-id="${d.id}" ${d.cards.includes(cardId)?'checked':''}>
      <span>${esc(d.name)}</span><small>${d.cards.length}</small>
    </label>`).join('');

  modal(`
    <h3>Add “${esc(card.name)}” to…</h3>
    <div class="decklist">${rows || '<p class="hint">No decks yet.</p>'}</div>
    <button class="btn ghost" id="mkDeck" style="width:100%;margin-top:6px">+ New deck</button>
    <div class="actions"><button class="btn" id="done">Done</button></div>
  `, root => {
    root.querySelectorAll('[data-deck-id]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        const d = state.decks.find(x=>x.id===cb.dataset.deckId);
        if(cb.checked){ if(!d.cards.includes(cardId)) d.cards.push(cardId); }
        else d.cards = d.cards.filter(x=>x!==cardId);
        save(); renderDeckBar();
      });
    });
    root.querySelector('#mkDeck').onclick = ()=>{ closeModal(); newDeck(); };
    root.querySelector('#done').onclick = ()=>{ closeModal(); render(); };
  });
}

/* ============================================================
   8. CARD EDITOR
   ============================================================ */
function openEditor(id){
  const c = id ? state.cards[id] : null;
  const teamOpts = Object.entries(TEAMS)
    .map(([ab,[nm]])=>`<option value="${ab}" ${c && c.team===ab?'selected':''}>${ab} — ${nm}</option>`)
    .join('');
  const statText = (c?.stats||[]).map(s=>`${s.k}: ${s.v}`).join('\n');

  modal(`
    <h3>${c ? 'Edit card' : 'New card'}</h3>
    <div class="field"><label>Name</label>
      <input id="f_name" value="${esc(c?.name||'')}" placeholder="Player, coach, anybody"></div>
    <div class="row">
      <div class="field"><label>Team</label><select id="f_team">${teamOpts}</select></div>
      <div class="field"><label>Position</label>
        <input id="f_pos" value="${esc(c?.pos||'')}" placeholder="QB / HC / GM" maxlength="4"></div>
      <div class="field" style="max-width:82px"><label>No.</label>
        <input id="f_jersey" value="${esc(c?.jersey??'')}" placeholder="00" maxlength="2"></div>
    </div>
    <div class="field"><label>Photo</label>
      <input id="f_photo" value="${esc(c?.photo||'')}" placeholder="Paste an image URL…">
      <input type="file" id="f_file" accept="image/*" style="margin-top:8px;font-size:12px">
    </div>
    <p class="hint">Leave blank and we'll try the official headshot, then fall back to a
      classic silhouette.</p>
    <div class="field"><label>Bio line</label>
      <input id="f_bio" value="${esc(c?.bio||'')}" placeholder="6-2 · 225 · Texas Tech"></div>
    <div class="field"><label>Stats — one per line, “Label: Value”</label>
      <textarea id="f_stats" rows="4" placeholder="Pro Bowls: 6&#10;Career TD: 250+">${esc(statText)}</textarea></div>
    <div class="field"><label>Note / caption</label>
      <textarea id="f_note" rows="2" placeholder="Your scouting take">${esc(c?.note||'')}</textarea></div>
    <div class="actions">
      ${c ? '<button class="btn ghost danger" id="del">Delete</button>' : ''}
      <button class="btn ghost" id="cancel">Cancel</button>
      <button class="btn" id="ok">Save</button>
    </div>
  `, root => {
    const fileEl = root.querySelector('#f_file');
    let uploaded = null;
    fileEl.addEventListener('change', async ()=>{
      const f = fileEl.files[0]; if(!f) return;
      try{ uploaded = await shrinkImage(f); toast('Photo attached'); }
      catch(err){ toast('Could not read that image'); }
    });

    root.querySelector('#ok').onclick = ()=>{
      const name = root.querySelector('#f_name').value.trim();
      if(!name){ toast('Give the card a name'); return; }
      const stats = root.querySelector('#f_stats').value.split('\n')
        .map(l=>l.trim()).filter(Boolean)
        .map(l=>{ const i = l.indexOf(':');
          return i<0 ? {k:l, v:''} : {k:l.slice(0,i).trim(), v:l.slice(i+1).trim()}; });

      const data = {
        name,
        team: root.querySelector('#f_team').value,
        pos:  root.querySelector('#f_pos').value.trim().toUpperCase(),
        jersey: root.querySelector('#f_jersey').value.trim(),
        photo: uploaded || root.querySelector('#f_photo').value.trim() || null,
        bio:  root.querySelector('#f_bio').value.trim(),
        note: root.querySelector('#f_note').value.trim(),
        stats
      };

      if(c){ Object.assign(c, data); }
      else{
        const nid = uid('c_');
        const nextNo = Object.keys(state.cards).length + 1;
        state.cards[nid] = {id:nid, no:nextNo, espnId:null, honors:'', live:null, ...data};
        if(state.active !== 'ALL'){
          const d = state.decks.find(x=>x.id===state.active);
          if(d) d.cards.push(nid);
        }
      }
      closeModal(); save(); render();
      toast(c ? 'Card updated' : 'Card added');
    };

    root.querySelector('#cancel').onclick = closeModal;
    const delBtn = root.querySelector('#del');
    if(delBtn) delBtn.onclick = ()=>{
      if(!confirm(`Delete “${c.name}”? This can't be undone.`)) return;
      delete state.cards[c.id];
      state.decks.forEach(d => d.cards = d.cards.filter(x=>x!==c.id));
      closeModal(); save(); render();
      toast('Card deleted');
    };
  });
}

/* Downscale uploads so localStorage doesn't blow its quota. */
function shrinkImage(file, max = 640){
  return new Promise((resolve, reject)=>{
    const fr = new FileReader();
    fr.onerror = reject;
    fr.onload = ()=>{
      const img = new Image();
      img.onerror = reject;
      img.onload = ()=>{
        const scale = Math.min(1, max / Math.max(img.width, img.height));
        const cv = document.createElement('canvas');
        cv.width  = Math.round(img.width  * scale);
        cv.height = Math.round(img.height * scale);
        cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
        resolve(cv.toDataURL('image/jpeg', 0.82));
      };
      img.src = fr.result;
    };
    fr.readAsDataURL(file);
  });
}

/* ============================================================
   9. LIVE REFRESH — stats + latest news
   Uses ESPN's public endpoints. Entirely optional: if the
   network, CORS or a firewall says no, the card keeps its
   bundled content and offers a news search link instead.
   ============================================================ */
async function refreshCard(id, btn){
  const c = state.cards[id];
  if(!c) return;
  btn.classList.add('busy');
  btn.textContent = '⟳ …';

  try{
    if(!c.espnId) c.espnId = await lookupEspnId(c.name);
    if(!c.espnId) throw new Error('no-id');

    const r = await fetch(
      `https://site.web.api.espn.com/apis/common/v3/sports/football/nfl/athletes/${c.espnId}/overview`,
      {headers:{'Accept':'application/json'}});
    if(!r.ok) throw new Error('http-' + r.status);
    const data = await r.json();

    const live = extractLive(data);
    if(!live.stats && !live.news) throw new Error('empty');
    c.live = {...(c.live||{}), ...live};
    save(); render();
    toast('Updated ' + c.name);
  }catch(err){
    console.warn('Live refresh unavailable:', err);
    btn.classList.remove('busy');
    btn.textContent = '⟳ Refresh';
    toast('Live data unavailable — using the card');
  }
}

/* Pull stats + a headline out of ESPN's payload. Their shape shifts
   between endpoints and positions, so this stays deliberately loose:
   anything it can't find simply doesn't get replaced on the card. */
function extractLive(data){
  const live = {};
  if(!data || typeof data !== 'object') return live;

  // stats — labels and values often sit at different depths
  const root = data.statistics ||
    deepFind(data, n => ((n.labels || n.names) && (n.splits || n.stats)) ? n : null);
  if(root){
    const labels = root.labels || root.names || root.displayNames || [];
    const vals   = root.splits?.stats || root.splits?.[0]?.stats || root.stats || [];
    if(labels.length && vals.length){
      live.stats = labels.slice(0,5).map((k,i)=>({
        k: String(k).toUpperCase(), v: String(vals[i] ?? '—')
      }));
    }
  }

  // news — first node that reads like a headline
  const item = deepFind(data, n => {
    const t = n.description || n.headline;
    return (typeof t === 'string' && t.length > 25) ? n : null;
  });
  if(item){
    const text = String(item.description || item.headline);
    live.news = {
      text: text.length > 200 ? text.slice(0,197).trimEnd() + '…' : text,
      src : 'ESPN · ' + (item.published
        ? new Date(item.published).toLocaleDateString(undefined,{month:'short',day:'numeric'})
        : 'latest')
    };
  }
  return live;
}

/* Best-effort name → ESPN id lookup. Tries a couple of known search
   endpoints and digs the id out of whatever shape comes back. */
async function lookupEspnId(name){
  const urls = [
    'https://site.web.api.espn.com/apis/common/v3/search?limit=5&sport=football&league=nfl&query=',
    'https://site.api.espn.com/apis/common/v3/search?limit=5&sport=football&league=nfl&query='
  ];
  for(const base of urls){
    try{
      const r = await fetch(base + encodeURIComponent(name));
      if(!r.ok) continue;
      const id = deepFind(await r.json(), node => {
        const type = String(node.type || '').toLowerCase();
        const uid  = String(node.uid || '');
        if(type === 'athlete' || type === 'player' || /~a:\d+/.test(uid)){
          const m = uid.match(/~a:(\d+)/);
          return m ? m[1] : (node.id ? String(node.id) : null);
        }
        return null;
      });
      if(id) return id;
    }catch(e){ /* try the next one */ }
  }
  return null;
}

/* Walk an unknown JSON shape and return the first node `pick` likes. */
function deepFind(obj, pick, depth = 0){
  if(!obj || typeof obj !== 'object' || depth > 7) return null;
  if(Array.isArray(obj)){
    for(const v of obj){ const r = deepFind(v, pick, depth+1); if(r) return r; }
    return null;
  }
  const hit = pick(obj);
  if(hit) return hit;
  for(const k in obj){ const r = deepFind(obj[k], pick, depth+1); if(r) return r; }
  return null;
}

/* A headshot 404'd — most likely our bundled id is stale. Try to resolve
   the real one from the player's name, once, then remember it. */
async function photoFail(img, id){
  const silo = img.nextElementSibling;
  img.hidden = true;
  if(silo) silo.hidden = false;

  const c = state.cards[id];
  if(!c || c.photo || c.healed) return;
  c.healed = true;                       // never loop on this card again

  const found = await lookupEspnId(c.name);
  if(!found || found === c.espnId) { save(); return; }

  c.espnId = found; save();
  const url = photoURL(c);
  if(!url) return;
  img.onload = () => { img.hidden = false; if(silo) silo.hidden = true; };
  img.src = url;
}

/* ============================================================
   10. MENU — import / export / reset
   ============================================================ */
function openMenu(){
  modal(`
    <h3>Collection</h3>
    <div class="decklist">
      <button class="deckrow" id="exp" style="text-align:left">
        <span>⬇ Export collection</span><small>.json</small></button>
      <button class="deckrow" id="imp" style="text-align:left">
        <span>⬆ Import collection</span><small>.json</small></button>
      <button class="deckrow" id="renameDeck" style="text-align:left">
        <span>✎ Rename current deck</span></button>
      <button class="deckrow danger" id="delDeck" style="text-align:left">
        <span>🗑 Delete current deck</span></button>
      <button class="deckrow danger" id="reset" style="text-align:left">
        <span>↺ Reset to starter pack</span></button>
    </div>
    <p class="hint" style="margin-top:12px">
      Everything lives in this browser. Export before you clear your history.</p>
    <div class="actions"><button class="btn ghost" id="cancel">Close</button></div>
  `, root => {
    root.querySelector('#cancel').onclick = closeModal;

    root.querySelector('#exp').onclick = ()=>{
      const blob = new Blob([JSON.stringify(state,null,2)],{type:'application/json'});
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gridiron-collection.json';
      a.click(); URL.revokeObjectURL(a.href);
      closeModal(); toast('Exported');
    };

    root.querySelector('#imp').onclick = ()=>{
      const inp = document.createElement('input');
      inp.type = 'file'; inp.accept = 'application/json';
      inp.onchange = ()=>{
        const f = inp.files[0]; if(!f) return;
        const fr = new FileReader();
        fr.onload = ()=>{
          try{
            const s = JSON.parse(fr.result);
            if(!s.cards || !s.decks) throw new Error('shape');
            state = {flipped:{}, active:'ALL', ...s};
            closeModal(); save(); render(); toast('Collection imported');
          }catch(e){ toast('That file did not look right'); }
        };
        fr.readAsText(f);
      };
      inp.click();
    };

    root.querySelector('#renameDeck').onclick = ()=>{
      if(state.active === 'ALL'){ toast('Pick a deck first'); return; }
      const d = state.decks.find(x=>x.id===state.active);
      const nm = prompt('Rename deck', d.name);
      if(nm){ d.name = nm.trim().slice(0,40); save(); render(); }
      closeModal();
    };

    root.querySelector('#delDeck').onclick = ()=>{
      if(state.active === 'ALL'){ toast('Pick a deck first'); return; }
      const d = state.decks.find(x=>x.id===state.active);
      if(!confirm(`Delete the deck “${d.name}”? The cards themselves stay.`)) return;
      state.decks = state.decks.filter(x=>x.id!==state.active);
      state.active = 'ALL';
      closeModal(); save(); render(); toast('Deck deleted');
    };

    root.querySelector('#reset').onclick = ()=>{
      if(!confirm('Reset everything back to the starter pack? Your custom cards and decks will be lost.')) return;
      localStorage.removeItem(KEY);
      state = load();
      closeModal(); save(); render(); toast('Back to the starter pack');
    };
  });
}

/* ============================================================
   11. MODAL PLUMBING
   ============================================================ */
function modal(html, setup){
  closeModal();
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  scrim.addEventListener('click', e => { if(e.target === scrim) closeModal(); });
  document.body.appendChild(scrim);
  setup && setup(scrim.querySelector('.sheet'));
  const first = scrim.querySelector('input,select,textarea,button');
  first && first.focus({preventScroll:true});
}
function closeModal(){ document.querySelectorAll('.scrim').forEach(s=>s.remove()); }
document.addEventListener('keydown', e => { if(e.key === 'Escape') closeModal(); });

/* ============================================================
   12. GO
   ============================================================ */
render();
</script>
